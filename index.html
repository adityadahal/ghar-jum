<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar Jaadai — Dashain micro jukebox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23F0A21C'/><path d='M8 26h30l12 10v12a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z' fill='%23F2EFE7' stroke='%23231A12' stroke-width='3' stroke-linejoin='round'/><rect x='13' y='30' width='10' height='8' rx='1' fill='%2318222E'/><rect x='26' y='30' width='10' height='8' rx='1' fill='%2318222E'/><path d='M40 30h4l7 6h-11z' fill='%2318222E'/><rect x='11' y='41' width='26' height='5' fill='%230E7A3C'/><circle cx='20' cy='51' r='6' fill='%231F1D1A'/><circle cx='43' cy='51' r='6' fill='%231F1D1A'/><circle cx='20' cy='51' r='2.2' fill='%23B6B2A8'/><circle cx='43' cy='51' r='2.2' fill='%23B6B2A8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --marigold:#F0A21C; --tika:#B8232E; --board:#F2E9D8; --ink:#231A12;
    --display:"Bakbak One",Impact,sans-serif; --body:"Mukta",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    -webkit-text-size-adjust:100%}
  /* the sunset has to land ON the horizon, which sits about a third of the way
     down the screen — pushed any lower and the hills hide all the warmth */
  body{font-family:var(--body);color:#fff;
    transition:background 1.1s ease;
    background:linear-gradient(#0A1126 0%,#1D2B4C 19%,#4C4A6B 33%,#96654A 43%,
      #DE8B52 53%,#F2BE7C 68%,#F7DCAC 100%)}
  /* after dark the sunset is gone and only a thin afterglow is left on the ridge */
  body.night{background:linear-gradient(#01030A 0%,#050916 18%,#0A1226 34%,#131C34 45%,
      #1D2440 55%,#2A2C48 72%,#3A3550 100%)}
  #scene{position:fixed;inset:0;display:block}
  #veil{position:fixed;inset:0;pointer-events:none;transition:background 1.1s ease;
    background:radial-gradient(125% 82% at 50% 16%,transparent 42%,rgba(8,11,26,.6) 100%)}
  body.night #veil{
    background:radial-gradient(125% 82% at 50% 16%,transparent 30%,rgba(2,4,12,.82) 100%)}
  #ytwrap{position:fixed;left:-10000px;top:0;width:320px;height:180px}

  #board{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    width:min(560px,calc(100vw - 20px));z-index:5}
  /* glass pill */
  .plate{position:relative;color:#fff;border-radius:999px;
    padding:9px 20px 9px 9px;display:flex;gap:13px;align-items:center;
    background:rgba(22,16,26,.42);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}

  /* artwork as a spinning record — saloon.wtf treatment */
  #disc{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,.22),0 4px 12px rgba(0,0,0,.45)}
  #art{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;
    background:#2A2129;animation:spin 8s linear infinite;animation-play-state:paused}
  #disc.spin #art{animation-play-state:running}
  #spindle{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:rgba(6,8,14,.8);
    box-shadow:0 0 0 2px rgba(255,255,255,.4);pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#art{animation:none}}

  .col{min-width:0;flex:1}
  h1{font-family:var(--body);font-weight:600;font-size:15px;color:#fff;
    line-height:1.25;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .credit{display:flex;align-items:center;gap:8px;margin:1px 0 0;font-size:12px;
    line-height:1.3;color:rgba(255,255,255,.7)}
  .credit .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bar{position:relative;height:4px;margin:7px 0 0;border-radius:999px;
    background:rgba(255,255,255,.22);cursor:pointer;touch-action:none}
  #bar::before{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
  #bar:focus-visible{outline:2px solid #fff;outline-offset:5px}
  #fill{height:100%;width:0;background:rgba(255,255,255,.92);border-radius:999px;
    pointer-events:none}
  #thumb{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.55);
    opacity:0;transition:opacity .14s;pointer-events:none}
  #bar:hover #thumb,#bar:focus-visible #thumb,#bar.scrub #thumb{opacity:1}
  #bar.scrub #thumb{transform:scale(1.15)}
  #clock{display:block;margin:4px 0 0;font-size:11px;color:rgba(255,255,255,.6);
    font-variant-numeric:tabular-nums}
  .deck{display:flex;align-items:center;gap:2px;flex:0 0 auto}

  /* the sticker laps the pill's outline, and halts with the music */
  #van{position:absolute;left:0;top:0;width:32px;height:19px;z-index:7;
    pointer-events:none;will-change:transform;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
  #van svg{width:100%;height:100%;display:block}
  #van .bob{animation:bob .5s ease-in-out infinite alternate;animation-play-state:paused}
  #van.rolling .bob{animation-play-state:running}
  @keyframes bob{to{transform:translateY(-1.1px)}}
  @media (prefers-reduced-motion:reduce){#van .bob{animation:none}}

  button{font-family:var(--body);color:inherit;background:transparent;border:0;
    padding:0;line-height:0;cursor:pointer;touch-action:manipulation}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .icon{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
    color:rgba(255,255,255,.82);transition:background .15s,color .15s,transform .1s}
  .icon:hover{background:rgba(255,255,255,.15);color:#fff}
  .icon:active{transform:scale(.93)}
  .icon svg{width:16px;height:16px;fill:currentColor;display:block}
  #play{width:42px;height:42px;background:#fff;color:#17121B;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #play:hover{background:#fff;color:#17121B;transform:scale(1.05)}
  #play:active{transform:scale(.96)}
  #play svg{width:17px;height:17px}
  #play[aria-busy="true"]{background:rgba(255,255,255,.45);color:#3A3340;box-shadow:none}
  #warn{display:none;margin:0 0 9px;padding:7px 12px;font-size:10.5px;line-height:1.45;
    color:#FFE2DC;background:rgba(120,26,18,.6);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);border-radius:999px;text-align:center}
  #warn code{background:rgba(255,255,255,.16);padding:1px 4px;font-size:10px;border-radius:3px}
  /* the muted-autoplay nudge is not an error, so it does not wear the error red */
  #warn.hush{color:#FFEAC2;background:rgba(26,19,12,.62);
    border-color:rgba(255,222,160,.34);cursor:pointer}

  /* glass, shared by the horn, the map and the route picker */
  .glass{background:rgba(22,16,26,.42);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}

  /* horn — right edge, vertically centred. Centred by margin, not by transform,
     so the hover and honk animations are free to use transform on their own. */
  #horn{position:fixed;right:18px;top:50%;margin-top:-34px;z-index:6;
    width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
    color:rgba(255,255,255,.9);transition:transform .12s,color .15s}
  #horn:hover{color:#fff}
  #horn svg{width:38px;height:38px;display:block;fill:currentColor;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

  /* GTA-style radar: the whole loop, with every stop on it */
  #map{position:fixed;left:20px;bottom:20px;z-index:6;width:168px;height:168px;
    border-radius:50%;overflow:hidden;padding:0}
  #map canvas{display:block;width:100%;height:100%}

  /* what the blips mean */
  #legend{position:fixed;left:20px;bottom:200px;z-index:6;padding:9px 12px;
    border-radius:14px;display:grid;gap:5px;pointer-events:none}
  #legend b{display:block;font-size:8.5px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:1px}
  #legend span{display:flex;align-items:center;gap:7px;font-size:10px;
    color:rgba(255,255,255,.82);white-space:nowrap}
  #legend i{width:8px;height:8px;border-radius:50%;flex:0 0 8px;
    box-shadow:0 0 0 1px rgba(8,10,16,.6)}
  #legend .you{width:0;height:0;border-radius:0;border-left:4.5px solid transparent;
    border-right:4.5px solid transparent;border-bottom:8px solid #fff;box-shadow:none}

  /* masthead */
  #mast{position:fixed;left:22px;top:18px;z-index:6;pointer-events:none;
    line-height:.92}
  #mast .np{display:block;font-family:var(--display);font-weight:400;
    font-size:clamp(38px,5.2vw,64px);color:#F6EFD8;letter-spacing:.01em;
    text-shadow:0 3px 18px rgba(6,10,24,.6),0 1px 2px rgba(6,10,24,.5)}
  #mast .en{display:block;margin-top:9px;font-size:10px;font-weight:700;
    letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.62);
    text-shadow:0 1px 6px rgba(6,10,24,.7)}

  /* route + tape pickers, top right */
  #route{position:fixed;right:18px;top:16px;z-index:6;display:flex;align-items:center;
    gap:9px;padding:7px 9px 7px 14px;border-radius:999px;color:#fff}
  #route .from{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.6)}
  #route .arrow{color:rgba(255,255,255,.45);font-size:12px}
  #route .div{width:1px;height:18px;background:rgba(255,255,255,.2)}
  /* custom dropdowns — a native select cannot be styled where it matters */
  .sel{position:relative}
  .sel .btn{display:flex;align-items:center;gap:7px;font-family:var(--body);
    font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    line-height:1;cursor:pointer;border:1px solid rgba(255,255,255,.25);
    border-radius:999px;padding:6px 10px 6px 12px;transition:background .15s,border-color .15s}
  .sel .btn svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .18s;opacity:.8}
  .sel.open .btn svg{transform:rotate(180deg)}
  .sel .menu{position:absolute;right:0;top:calc(100% + 9px);min-width:172px;
    padding:6px;border-radius:16px;display:none;z-index:20;
    max-height:min(58vh,340px);overflow:auto;overscroll-behavior:contain}
  .sel.open .menu{display:block;animation:drop .16s ease-out}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .sel .opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.02em;
    line-height:1.1;color:rgba(255,255,255,.8);cursor:pointer;
    padding:9px 11px;border-radius:11px;transition:background .12s,color .12s}
  .sel .opt:hover,.sel .opt.hot{background:rgba(255,255,255,.14);color:#fff}
  .sel .opt .tick{width:6px;height:6px;border-radius:50%;flex:0 0 6px;
    background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  .sel .opt[aria-selected="true"]{color:#fff}
  .sel .opt[aria-selected="true"] .tick{background:currentColor;box-shadow:none}
  .sel .menu::-webkit-scrollbar{width:8px}
  .sel .menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}

  #destSel .btn{color:#EAF7EC;background:rgba(14,122,60,.85)}
  #destSel .btn:hover{background:rgba(18,150,74,.92)}
  #destSel .opt[aria-selected="true"]{color:#7FE0A6}
  #tapeSel .btn{color:#fff;background:rgba(255,255,255,.12)}
  #tapeSel .btn:hover{background:rgba(255,255,255,.22)}
  #tapeSel .opt[aria-selected="true"]{color:var(--marigold)}
  #horn:hover{transform:scale(1.07)}
  #horn.honk{animation:honk .42s ease-out}       /* two pulses, one per pop */
  @keyframes honk{0%{transform:scale(.93)} 16%{transform:scale(1.14)}
    40%{transform:scale(.97)} 58%{transform:scale(1.12)} 100%{transform:scale(1)}}

  /* sun / moon — the sky switch, parked under the horn on the same edge */
  #sky{position:fixed;right:26px;top:50%;margin-top:44px;z-index:6;
    width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
    color:rgba(255,255,255,.88);transition:transform .12s,color .15s}
  #sky:hover{color:#fff;transform:scale(1.07)}
  #sky svg{width:25px;height:25px;display:block;fill:currentColor;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
  #sky .rays{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  #sky .moon{display:none}
  body.night #sky{color:#F6E7B4}
  body.night #sky .sun{display:none}
  body.night #sky .moon{display:block}
  /* the icon swings in when it changes, so the switch reads as a switch */
  #sky.flip svg{animation:skyflip .45s cubic-bezier(.3,1.4,.5,1)}
  @keyframes skyflip{from{transform:rotate(-150deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){#sky.flip svg{animation:none}}

  #hint{position:fixed;left:0;right:0;top:15px;text-align:center;z-index:5;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
  /* the keyboard hint is centred across the full width, so it runs under the
     masthead and the route pill long before the window gets properly narrow */
  @media (max-width:1200px){ #hint{display:none} }

  /* ---------- narrower windows: the legend goes, the radar shrinks ---------- */
  @media (max-width:900px){
    #map{width:124px;height:124px;left:12px;bottom:calc(96px + env(safe-area-inset-bottom))}
    #legend{display:none}
  }

  /* ---------- phones. Almost the whole screen is scene, so every control
       tucks into a corner and nothing is allowed to sit over the micro. ---------- */
  @media (max-width:560px){
    #hint{display:none}
    #mast{left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top))}
    #mast .np{font-size:31px}
    #mast .en{margin-top:5px;font-size:9px;letter-spacing:.2em}
    #route{right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));
      padding:5px 7px 5px 10px;gap:6px;
      max-width:calc(100% - 150px)}                 /* never crowd the masthead */
    #route .from,#route .arrow{display:none}
    .sel{min-width:0}
    .sel .btn{min-width:0;font-size:10px;letter-spacing:.06em;padding:7px 9px 7px 11px}
    .sel .btn .val{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .sel .menu{min-width:150px}
    #board{bottom:calc(12px + env(safe-area-inset-bottom));
      width:min(560px,calc(100vw - 16px))}
    /* horn and radar flank the player, clear of the road up the middle */
    /* --boardH is measured from the player itself, so these clear it whatever
       the layout does to its height */
    #horn{top:auto;margin-top:0;width:52px;height:52px;
      right:calc(12px + env(safe-area-inset-right));
      bottom:calc(var(--boardH,92px) + 24px + env(safe-area-inset-bottom))}
    #horn svg{width:29px;height:29px}
    /* the sky switch stacks straight above the horn */
    #sky{top:auto;margin-top:0;width:44px;height:44px;
      right:calc(16px + env(safe-area-inset-right));
      bottom:calc(var(--boardH,92px) + 86px + env(safe-area-inset-bottom))}
    #sky svg{width:22px;height:22px}
    #map{display:block;width:92px;height:92px;
      left:calc(12px + env(safe-area-inset-left));
      bottom:calc(var(--boardH,92px) + 20px + env(safe-area-inset-bottom))}
    /* fingers are blunter than a mouse: give the controls more to aim at */
    #bar::before{top:-14px;bottom:-14px}
    .icon{width:38px;height:38px} .icon svg{width:17px;height:17px}
    #play{width:46px;height:46px} #play svg{width:18px;height:18px}
    .sel .opt{padding:11px 12px;font-size:12.5px}
  }
  @media (max-width:400px){
    #disc{width:44px;height:44px;flex-basis:44px}
    #spindle{width:9px;height:9px;margin:-4.5px 0 0 -4.5px}
    .plate{padding:8px 15px 8px 8px;gap:11px}
    h1{font-size:14px} .credit{font-size:11px}
    #map{width:82px;height:82px}
    #mast .np{font-size:27px}
  }

  /* ---------- landscape phones: short, so keep the middle band clear ---------- */
  @media (max-height:470px) and (orientation:landscape){
    #hint{display:none}
    #legend{display:none}
    #mast{top:calc(10px + env(safe-area-inset-top))}
    #mast .np{font-size:30px} #mast .en{display:none}
    #route{top:calc(10px + env(safe-area-inset-top))}
    #horn{width:50px;height:50px;margin-top:-25px;
      right:calc(12px + env(safe-area-inset-right))}
    #horn svg{width:28px;height:28px}
    #sky{width:42px;height:42px;margin-top:33px;
      right:calc(16px + env(safe-area-inset-right))}
    #sky svg{width:21px;height:21px}
    #board{bottom:calc(8px + env(safe-area-inset-bottom));
      width:min(460px,calc(100vw - 190px))}
    #map{width:88px;height:88px;left:calc(10px + env(safe-area-inset-left));
      bottom:calc(10px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="veil"></div>
<div id="hint">← → change song · space play · H horn · N night · drag the bar to seek</div>

<div id="route" class="glass">
  <span class="from">Kathmandu</span><span class="arrow">→</span>
  <div class="sel" id="destSel"></div>
  <span class="div"></span>
  <div class="sel" id="tapeSel"></div>
</div>

<div id="mast">
  <span class="np">दशैं लाग्यो</span>
  <span class="en">Ghar jaadai · घर जाँदै</span>
</div>

<div id="legend" class="glass">
  <b>On the route</b>
  <span><i style="background:#3FBF6E"></i>Chiya pasal</span>
  <span><i style="background:#F0A21C"></i>Thakali khana</span>
  <span><i style="background:#5FA8F0"></i>Sauchalaya</span>
  <span><i style="background:#E4DCC8"></i>Pul · khola</span>
  <span><i style="background:#B9B2A6"></i>Potholes</span>
  <span><i class="you"></i>You</span>
</div>
<div id="map" class="glass"><canvas id="mapc"></canvas></div>

<button id="horn" class="glass" aria-label="Sound the horn" title="Horn (H)">
  <!-- bulb horn: flared bell, neck, squeeze bulb -->
  <svg viewBox="0 0 44 30" aria-hidden="true">
    <path d="M4.6 2.2Q1.4 15 4.6 27.8L20.4 19.6V10.4z"/>
    <path d="M20.4 10.8h5.4a4.2 4.2 0 0 1 0 8.4h-5.4z"/>
    <circle cx="33.4" cy="15" r="6.6"/>
  </svg>
</button>

<button id="sky" class="glass" aria-label="Switch to night" aria-pressed="false" title="Night (N)">
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4.5"/>
    <g class="rays"><path d="M12 1.7v2.5M12 19.8v2.5M22.3 12h-2.5M4.2 12H1.7
      M19.3 4.7l-1.8 1.8M6.5 17.5l-1.8 1.8M19.3 19.3l-1.8-1.8M6.5 6.5L4.7 4.7"/></g>
  </svg>
  <!-- crescent: one disc with a second bitten out of it -->
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M21.2 14.6A9 9 0 0 1 9.4 2.8 9.2 9.2 0 1 0 21.2 14.6z"/>
  </svg>
</button>

<div id="board">
  <p id="warn"></p>
  <div class="plate" id="plate">
    <div id="disc">
      <img id="art" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
      <span id="spindle"></span>
    </div>
    <div class="col">
      <h1 id="title">Tap play to start the tape</h1>
      <p class="credit">
        <span class="who" id="credit">Nepali</span>
      </p>
      <div id="bar" role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="fill"></div><div id="thumb"></div>
      </div>
      <span id="clock"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
    </div>
    <div class="deck">
      <button id="prev" class="icon" aria-label="Previous song" title="Previous">

function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}

/* The BP Highway at Sindhuli Gadhi does not go anywhere in a straight line: it
   winds along the ridges and doubles back on itself climbing them. Extra
   harmonics on the radius give those bends, and a bigger swing in height gives
   the climbs and drops between them. */
const CP=[];
for(let i=0;i<34;i++){const a=i/34*Math.PI*2;
  const r=268+Math.sin(a*3)*88+Math.cos(a*5)*50+Math.sin(a*7+0.6)*24;
  CP.push(new THREE.Vector3(Math.cos(a)*r,
    8+Math.sin(a*2)*20+Math.cos(a*3.7)*11+Math.sin(a*5.3+1.1)*6,Math.sin(a)*r));}

  for(let i=0;i<RS.length;i++){const dx=RS[i].x-x,dz=RS[i].z-z,d=dx*dx+dz*dz;
    if(d<md){md=d;ny=RS[i].y;}}

/* ---- THE KHOLA — a river cutting straight across the road at BRIDGE_U.
   It is carved into the terrain itself, road corridor included: that gorge is
   what the bridge spans, so the two have to agree on where the ground is. ---- */
const BR_P=curve.getPointAt(BRIDGE_U);
const BR_T=curve.getTangentAt(BRIDGE_U).setY(0).normalize();   /* along the road */
const BR_A=new THREE.Vector3(-BR_T.z,0,BR_T.x);                /* along the river */
const WATER_Y=BR_P.y-10.5;
const RIV_W=14,RIV_BANK=30,RIV_RUN=230;
/* a: how far down the river. b: how far across it — measured up the road, so the
   gorge opens exactly RIV_BANK either side of the crossing and the deck can span it. */
function riverFrame(x,z){
  const dx=x-BR_P.x,dz=z-BR_P.z;
  const a=dx*BR_A.x+dz*BR_A.z;
  /* it meanders, but both terms vanish at a=0 so it passes dead under the bridge */
  return {a,b:dx*BR_T.x+dz*BR_T.z-(Math.sin(a*0.0115)*14+Math.sin(a*0.026)*6)};

  const f=riverFrame(x,z);
  return (1-sstep(RIV_W,RIV_BANK,Math.abs(f.b)))*(1-sstep(RIV_RUN*0.74,RIV_RUN,Math.abs(f.a)));

function terrainY(x,z){
  const n=nearRoad(x,z),rad=Math.hypot(x,z);
  /* the outer bowl is kept low so the ridge bands behind it stay in view */

  /* the terraces: rice fields cut the hillside into steps all the way up */
  if(fbm(x*0.0055+9,z*0.0055+9)>0.44&&h<58) h=Math.round(h/2.05)*2.05;
  const k=sstep(11,52,n.d);
  const y=(n.y-0.55)*(1-k)+h*k;
  const m=riverMask(x,z);
  if(m<=0) return y;
  const f=riverFrame(x,z);             /* deepest mid-stream, shelving up to the banks */
  return y*(1-m)+(WATER_Y-1.5-Math.max(0,RIV_W-Math.abs(f.b))*0.17)*m;}

const SEG=LOW?132:168,SPAN=1250;
const tg=new THREE.PlaneGeometry(SPAN,SPAN,SEG,SEG);tg.rotateX(-Math.PI/2);
const tp=tg.attributes.position,cols=[];
/* Sindhuli in Dashain: wet-green valleys, ripe gold on the terraces, and sal
   forest closing over the ridges — these hills are wooded to the top, so there
   is no bare rock and certainly no snow at this height. */
const cLow=new THREE.Color(0x63914A),cField=new THREE.Color(0xC7A94E),
      cMid=new THREE.Color(0x466E37),cRock=new THREE.Color(0x5A7047),
      cHaze=new THREE.Color(0x8D9A80);
for(let i=0;i<tp.count;i++){
  const x=tp.getX(i),z=tp.getZ(i),y=terrainY(x,z);tp.setY(i,y);
  const c=new THREE.Color();
  if(y<16) c.copy(cLow).lerp(cField,fbm(x*0.006+3,z*0.006+3));
  else if(y<44) c.copy(cLow).lerp(cMid,sstep(16,44,y));
  else if(y<78) c.copy(cMid).lerp(cRock,sstep(44,78,y));
  else c.copy(cRock).lerp(cHaze,sstep(78,150,y));
  /* the terraced ground reads gold — the same test that cut the steps in */
  if(y<58&&fbm(x*0.0055+9,z*0.0055+9)>0.44)
    c.lerp(cField,0.22+0.34*fbm(x*0.02+21,z*0.02+21));

function ribbon(halfW,yOff,mat){
  const N=520,pos=[],idx=[],up=new THREE.Vector3(0,1,0);
  for(let i=0;i<=N;i++){
    const u=(i%N)/N;
    const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
    const side=new THREE.Vector3().crossVectors(tan,up).normalize();
    const a=p.clone().addScaledVector(side,-halfW),b=p.clone().addScaledVector(side,halfW);
    a.y+=yOff;b.y+=yOff;pos.push(a.x,a.y,a.z,b.x,b.y,b.z);
    if(i<N){const o=i*2;idx.push(o,o+1,o+2,o+1,o+3,o+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();return new THREE.Mesh(g,mat);

scene.add(ribbon(6.6,0.02,new THREE.MeshLambertMaterial({color:0x554E40})));

{

const TN=LOW?420:760;
const NHOUSE=LOW?24:46,NBULB=LOW?5:9;

{
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3();
  const lampGeo=new THREE.SphereGeometry(0.3,6,5);

    g.setIndex(idx);

    /* after dark the far ridges go to silhouette, the nearest one darkest */
    skyBands.push({mat,day:new THREE.Color(b.col),
      night:new THREE.Color(b.col).lerp(NIGHT_INK,0.9-bi*0.05)});

}

   lamp, gone by the time it reaches the road */
const beamTex=tex((c,w,h)=>{

  g.addColorStop(.72,'rgba(255,232,176,.12)');g.addColorStop(1,'rgba(255,226,164,0)');

/* ---------- The digital face of a roadside board. Every pasal that can afford
   an inverter has swapped its painted tin for an LED panel, and they are all
   too bright for the size of the shop. Same canvas size as the day board, so
   the two textures are interchangeable on the same mesh. ---------- */
function ledBoard(w,h,accent,lines){
  return tex((c,W,H)=>{
    c.fillStyle='#04060B';c.fillRect(0,0,W,H);
    c.strokeStyle='#161E2B';c.lineWidth=11;c.strokeRect(5,5,W-10,H-10);
    c.globalAlpha=0.6;c.strokeStyle=accent;c.lineWidth=3;
    c.strokeRect(14,14,W-28,H-28);c.globalAlpha=1;
    c.textAlign='center';c.textBaseline='middle';
    for(const L of lines){
      c.font='bold '+L.size+'px sans-serif';
      c.shadowColor=L.col;c.shadowBlur=L.size*0.6;
      c.fillStyle=L.col;c.fillText(L.t,W/2,H*L.y);
      c.fillText(L.t,W/2,H*L.y);                    /* twice, for the bloom */
      c.shadowBlur=L.size*0.22;c.globalAlpha=0.6;c.fillStyle='#FFFFFF';
      c.fillText(L.t,W/2,H*L.y);                    /* a white core in the colour */
      c.globalAlpha=1;c.shadowBlur=0;

    c.globalCompositeOperation='destination-out';
    c.fillStyle='rgba(0,0,0,.26)';
    for(let y=0;y<H;y+=3) c.fillRect(0,y,W,1);
    c.globalCompositeOperation='source-over';

}

  const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
  const side=new THREE.Vector3().crossVectors(tan,UP).normalize();
  const at=p.clone().addScaledVector(side,off);
  at.y=terrainY(at.x,at.z);
  return {p,tan,side,at};
}
function facing(group,at,target){        /* +Z of the group looks at target */
  group.position.copy(at);
  group.lookAt(target.x,at.y,target.z);
}

/* a face that blinks and opens its mouth — drawn small, animated per person */
const SKIN=[0x8A5E3C,0x9B6B45,0x7A5133,0xA87A52];
function makeHead(tone){
  const head=new THREE.Group();
  const skull=new THREE.Mesh(new THREE.SphereGeometry(0.3,9,8),MAT(tone));
  head.add(skull);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.31,9,8,0,Math.PI*2,0,1.15),MAT(0x1F1912));
  hair.position.y=0.03;head.add(hair);
  const eyes=[],dark=MAT(0x14100C),white=MAT(0xF6F1E6);
  for(const sx of [-0.11,0.11]){
    const w=new THREE.Mesh(new THREE.SphereGeometry(0.058,7,6),white);
    w.position.set(sx,0.05,0.265);w.scale.set(1,1,0.5);head.add(w);

  mouth.position.set(0,-0.12,0.265);mouth.scale.set(1.3,0.45,0.4);head.add(mouth);

/* a body with a head, one swinging arm, and a glass of tea */
function makePerson(shirtCol,scale){

/* ---------- THE KHOLA AND THE PUL — the river, and the bridge that carries
   the road over it. The gorge is cut into the terrain by terrainY(), so the
   deck, the piers and the water all agree on where the ground went. ---------- */
let riverFlow=null;                    /* the water texture, scrolled downstream */
const BR_HS=33/LEN0;                   /* half the deck, in curve units */
{
  const SIDED=(c)=>new THREE.MeshPhongMaterial({color:c,flatShading:true,
    shininess:0,side:THREE.DoubleSide});
  const conc=SIDED(0xC3BCAC),soff=SIDED(0x9A9386),pier=MAT(0xA9A294),
        steel=MAT(0x8E8A82),paint=MAT(0xE8DCC0);

  /* a quad strip from [left,right] pairs — the deck, its soffit and its skirts */
  function strip(pairs,mat){
    const pos=[],idx=[];
    for(let i=0;i<pairs.length;i++){
      const a=pairs[i][0],b=pairs[i][1];
      pos.push(a.x,a.y,a.z,b.x,b.y,b.z);
      if(i<pairs.length-1){const o=i*2;idx.push(o,o+1,o+2,o+1,o+3,o+2);}
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setIndex(idx);g.computeVertexNormals();
    return new THREE.Mesh(g,mat);
  }

  const STEPS=30,DECK_W=7.4,DECK_D=1.3;
  const top=[],under=[],skL=[],skR=[],kbL=[],kbR=[],mid=[];
  for(let i=0;i<=STEPS;i++){
    const u=((BRIDGE_U-BR_HS+2*BR_HS*i/STEPS)%1+1)%1;
    const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
    const side=new THREE.Vector3().crossVectors(tan,UP).normalize();
    const l=p.clone().addScaledVector(side,-DECK_W),r=p.clone().addScaledVector(side,DECK_W);
    l.y=p.y-0.02;r.y=p.y-0.02;
    const lb=l.clone(),rb=r.clone();lb.y-=DECK_D;rb.y-=DECK_D;
    top.push([l,r]);under.push([lb,rb]);skL.push([l,lb]);skR.push([r,rb]);
    kbL.push([l.clone().setY(l.y+0.46),l]);kbR.push([r,r.clone().setY(r.y+0.46)]);
    mid.push({p,tan,side});
  }
  scene.add(strip(top,conc),strip(under,soff),strip(skL,soff),strip(skR,soff),
            strip(kbL,conc),strip(kbR,conc));

  /* pipe railings and their posts, one instanced mesh each */
  const rails=new THREE.InstancedMesh(new THREE.BoxGeometry(0.13,0.13,1),paint,STEPS*4);
  const posts=new THREE.InstancedMesh(new THREE.BoxGeometry(0.17,1.6,0.17),steel,(STEPS+1)*2);
  {
    const m4=new THREE.Matrix4(),q4=new THREE.Quaternion(),sc=new THREE.Vector3(),
          zero=new THREE.Vector3(),dir=new THREE.Vector3();
    let ri=0,pi=0;
    for(let i=0;i<mid.length;i++){
      const {p,tan,side}=mid[i];
      for(const sx of [-1,1]){
        const at=p.clone().addScaledVector(side,sx*(DECK_W-0.95));
        if(i%3===0){
          q4.setFromRotationMatrix(new THREE.Matrix4().lookAt(zero,tan,UP));
          posts.setMatrixAt(pi++,m4.compose(new THREE.Vector3(at.x,p.y+0.78,at.z),
            q4,sc.set(1,1,1)));
        }
        if(i<mid.length-1){
          const nx=mid[i+1].p.clone().addScaledVector(mid[i+1].side,sx*(DECK_W-0.95));
          const seg=at.distanceTo(nx),c=at.clone().lerp(nx,0.5);
          q4.setFromRotationMatrix(new THREE.Matrix4().lookAt(zero,dir.subVectors(nx,at).normalize(),UP));
          for(const hy of [0.9,1.48])
            rails.setMatrixAt(ri++,m4.compose(new THREE.Vector3(c.x,p.y+hy,c.z),
              q4,sc.set(1,1,seg*1.04)));
        }
      }
    }
    rails.count=ri;posts.count=pi;
  }
  scene.add(rails,posts);

  /* a steel through-truss over the span. Every member is one instance of the
     same unit box, scaled to length — 75 of them cost a single draw call. */
  {
    const PN=8,TH=0.3,H=6.3,OFF=DECK_W-0.15;
    const girder=new THREE.MeshPhongMaterial({color:0x8D949B,flatShading:true,shininess:0});
    const truss=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),girder,96);
    const q=new THREE.Quaternion(),m4=new THREE.Matrix4(),sc=new THREE.Vector3(),
          c=new THREE.Vector3(),d=new THREE.Vector3(),zero=new THREE.Vector3();
    let ti=0;
    const member=(a,b,th)=>{
      d.subVectors(b,a);const len=d.length();
      if(len<0.02||ti>=96) return;
      q.setFromRotationMatrix(new THREE.Matrix4().lookAt(zero,d.normalize(),UP));
      truss.setMatrixAt(ti++,m4.compose(c.copy(a).lerp(b,0.5),q,sc.set(th,th,len)));
    };
    const low=[],high=[];
    for(let i=0;i<=PN;i++){
      const u=((BRIDGE_U-BR_HS+2*BR_HS*i/PN)%1+1)%1;
      const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
      const side=new THREE.Vector3().crossVectors(tan,UP).normalize();
      const a=[],b=[];
      for(const sx of [-1,1]){
        const foot=p.clone().addScaledVector(side,sx*OFF);foot.y=p.y+0.15;
        a.push(foot);b.push(foot.clone().setY(foot.y+H));
      }
      low.push(a);high.push(b);
    }
    for(let i=0;i<=PN;i++){
      for(let s=0;s<2;s++){
        member(low[i][s],high[i][s],TH);                 /* vertical */
        if(i<PN){
          member(high[i][s],high[i+1][s],TH*1.2);        /* top chord */
          member(low[i][s],low[i+1][s],TH*1.2);          /* bottom chord */
          if(i%2) member(low[i][s],high[i+1][s],TH*0.8); /* diagonals, alternating */
          else    member(high[i][s],low[i+1][s],TH*0.8);
        }
      }
      member(high[i][0],high[i][1],TH*0.9);              /* strut overhead */
    }
    truss.count=ti;
    scene.add(truss);
  }

  /* two piers standing in the shallows, each a wall across the river */
  for(const sx of [-1,1]){
    const p=curve.getPointAt(((BRIDGE_U+sx*17/LEN0)%1+1)%1),
          tan=curve.getTangentAt(((BRIDGE_U+sx*17/LEN0)%1+1)%1);
    const g=new THREE.Group();
    g.position.copy(p);g.lookAt(p.x+tan.x,p.y,p.z+tan.z);
    const base=terrainY(p.x,p.z),H=Math.max(1.5,p.y-DECK_D-0.1-base);
    const col=new THREE.Mesh(new THREE.BoxGeometry(11.8,H,3.1),pier);
    col.position.y=base+H/2-p.y;g.add(col);
    const foot=new THREE.Mesh(new THREE.BoxGeometry(13.4,1.2,4.6),pier);
    foot.position.y=base+0.6-p.y;g.add(foot);
    scene.add(g);
  }

  /* the water: a ribbon down the channel whose ripples scroll downstream */
  const rip=tex((c,w,h)=>{
    const g=c.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#2C6C86');g.addColorStop(.5,'#3C84A0');g.addColorStop(1,'#2C6C86');
    c.fillStyle=g;c.fillRect(0,0,w,h);
    c.strokeStyle='rgba(228,244,250,.34)';c.lineWidth=2.2;
    for(let i=0;i<46;i++){
      const x=Math.random()*w,y=Math.random()*h,l=10+Math.random()*34;
      c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+l*0.5,y-3.5,x+l,y);c.stroke();
    }
  },256,256);
  rip.wrapS=rip.wrapT=THREE.RepeatWrapping;rip.repeat.set(1.6,16);
  riverFlow=rip;
  {
    const N=96,pos=[],uv=[],idx=[],half=RIV_W+3.6;
    for(let i=0;i<=N;i++){
      const a=-RIV_RUN+2*RIV_RUN*i/N;
      const wig=Math.sin(a*0.0115)*14+Math.sin(a*0.026)*6;
      const cx=BR_P.x+BR_A.x*a+BR_T.x*wig, cz=BR_P.z+BR_A.z*a+BR_T.z*wig;
      pos.push(cx-BR_T.x*half,WATER_Y,cz-BR_T.z*half,
               cx+BR_T.x*half,WATER_Y,cz+BR_T.z*half);
      uv.push(0,i/N,1,i/N);
      if(i<N){const o=i*2;idx.push(o,o+1,o+2,o+1,o+3,o+2);}
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.setIndex(idx);g.computeVertexNormals();
    scene.add(new THREE.Mesh(g,new THREE.MeshPhongMaterial({map:rip,transparent:true,
      opacity:0.9,shininess:80,specular:0x9FD8E8,side:THREE.DoubleSide})));
  }

  /* boulders in the stream, the way every khola has them */
  for(let i=0;i<(LOW?9:16);i++){
    const a=-RIV_RUN*0.86+Math.random()*RIV_RUN*1.72;
    const wig=Math.sin(a*0.0115)*14+Math.sin(a*0.026)*6;
    const off=(Math.random()-0.5)*RIV_W*1.8;
    const s=0.7+Math.random()*1.9;
    const b=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),MAT(0x9A9184));
    b.position.set(BR_P.x+BR_A.x*a+BR_T.x*(wig+off),WATER_Y-0.4+s*0.45,
                   BR_P.z+BR_A.z*a+BR_T.z*(wig+off));
    b.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
    b.scale.y=0.68;scene.add(b);
  }

  /* the name board, facing the traffic coming up to the crossing */
  {
    const bt=tex((c,w,h)=>{
      c.fillStyle='#1B5E86';c.fillRect(0,0,w,h);
      c.strokeStyle='#F0C21C';c.lineWidth=8;c.strokeRect(6,6,w-12,h-12);
      c.fillStyle='#F4F8FB';c.textAlign='center';c.textBaseline='middle';
      c.font='bold 50px sans-serif';c.fillText('त्रिशूली खोला',w/2,h*0.36);
      c.font='bold 25px sans-serif';c.fillText('TRISHULI KHOLA · PUL',w/2,h*0.72);
    },420,132);
    const {at}=roadside(((BRIDGE_U-BR_HS-0.007)%1+1)%1,-9.5);
    const back=curve.getPointAt(((BRIDGE_U-BR_HS-0.04)%1+1)%1);
    const g=new THREE.Group();facing(g,at,back);
    for(const sx of [-1.6,1.6]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.13,4.6,6),steel);
      post.position.set(sx,2.3,0);g.add(post);
    }
    const bd=new THREE.Mesh(new THREE.PlaneGeometry(4.2,1.32),
      dimAtNight(new THREE.MeshBasicMaterial({map:bt}),0.7));   /* reflective, not lit */
    bd.position.set(0,3.7,0.09);g.add(bd);
    scene.add(g);
  }

  /* the expansion joints at either end give the deck its two little knocks */
  for(const sx of [-1,1])
    HOLES.push({d:(((BRIDGE_U+sx*BR_HS)*LEN0)%LEN0+LEN0)%LEN0,jolt:0.055});
}

/* ---------- KHOLSI — the little streams. Every fold in these hills has one
   coming off the top, and they wind rather than run straight because they take
   the steepest way down. That is exactly how these are traced: sample the same
   terrain function the hills are built from, step downhill, and let the path
   arc where the ground makes it arc. Water never runs uphill this way, and each
   one ends where the road cuts it off, at a culvert headwall. ---------- */
{
  const water=new THREE.MeshPhongMaterial({map:riverFlow,transparent:true,
    opacity:0.93,shininess:80,specular:0x9FD8E8,side:THREE.DoubleSide});
  const bedM=MAT(0x7A6F60),wallM=MAT(0xB4AE9F),mouthM=MAT(0x15120E);
  const UPV=new THREE.Vector3(0,1,0);

  /* one step at a time, down the gradient, with enough momentum to carry it
     over the flat of a terrace instead of stalling there */
  function course(from){
    const pts=[from.clone()];
    const dir=new THREE.Vector3(),g=new THREE.Vector3();
    let p=from.clone(),last=p.y;
    for(let i=0;i<120;i++){
      const e=3.4;
      g.set(terrainY(p.x-e,p.z)-terrainY(p.x+e,p.z),0,
            terrainY(p.x,p.z-e)-terrainY(p.x,p.z+e));
      if(i===0){
        if(g.lengthSq()<1e-8) break;
        dir.copy(g).normalize();
      }else{
        dir.lerp(g.normalize(),0.4).normalize();
      }
      const n=p.clone().addScaledVector(dir,5.4);
      n.y=terrainY(n.x,n.z);
      if(n.y>last+0.9) break;                    /* it has started climbing */
      if(Math.hypot(n.x,n.z)>610) break;
      pts.push(n);
      if(nearRoad(n.x,n.z).d<8.5) break;         /* the culvert takes it under */
      if(riverMask(n.x,n.z)>0.25) break;         /* it has joined the khola */
      p=n;last=n.y;
    }
    return pts;
  }

  function buildStream(pts){
    const posW=[],uvW=[],idxW=[],posB=[],idxB=[];
    const d=new THREE.Vector3(),side=new THREE.Vector3();
    let run=0;
    for(let i=0;i<pts.length;i++){
      const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
      d.subVectors(b,a).setY(0);
      if(d.lengthSq()<1e-8) d.set(0,0,1);
      side.crossVectors(d.normalize(),UPV).normalize();
      if(i>0) run+=pts[i].distanceTo(pts[i-1]);
      const p=pts[i],w=0.8+(i/(pts.length-1))*2.5;   /* it gathers as it goes down */
      for(const s of [-1,1]){
        const q=p.clone().addScaledVector(side,s*w);
        posW.push(q.x,terrainY(q.x,q.z)+0.17,q.z);
        const r=p.clone().addScaledVector(side,s*(w+0.95));
        posB.push(r.x,terrainY(r.x,r.z)+0.06,r.z);
      }
      uvW.push(0,run/200,1,run/200);
      if(i<pts.length-1){
        const o=i*2;
        idxW.push(o,o+1,o+2,o+1,o+3,o+2);
        idxB.push(o,o+1,o+2,o+1,o+3,o+2);
      }
    }
    const gw=new THREE.BufferGeometry();
    gw.setAttribute('position',new THREE.Float32BufferAttribute(posW,3));
    gw.setAttribute('uv',new THREE.Float32BufferAttribute(uvW,2));
    gw.setIndex(idxW);gw.computeVertexNormals();
    const gb=new THREE.BufferGeometry();
    gb.setAttribute('position',new THREE.Float32BufferAttribute(posB,3));
    gb.setIndex(idxB);gb.computeVertexNormals();
    scene.add(new THREE.Mesh(gb,bedM),new THREE.Mesh(gw,water));

    /* where it meets the road, the headwall and the mouth of the pipe */
    const end=pts[pts.length-1],back=pts[Math.max(0,pts.length-2)];
    if(nearRoad(end.x,end.z).d<11){
      const g=new THREE.Group();
      g.position.set(end.x,terrainY(end.x,end.z),end.z);
      g.lookAt(back.x,g.position.y,back.z);         /* +Z faces back upstream */
      const hw=new THREE.Mesh(new THREE.BoxGeometry(4.6,1.5,0.7),wallM);
      hw.position.y=0.5;g.add(hw);
      const pipe=new THREE.Mesh(new THREE.CylinderGeometry(0.72,0.72,0.9,10),mouthM);
      pipe.rotation.x=Math.PI/2;pipe.position.set(0,0.42,0.28);g.add(pipe);
      scene.add(g);
    }
  }

  /* Several of these have to be in the opening shot, so the first few sit just
     up the road from where the scene starts parked. */
  for(const u of [0.062,0.082,0.104,0.128,0.30,0.55,0.80]){
    let src=null;
    for(const s of [-1,1]) for(let dd=58;dd<=142;dd+=28){
      const {at}=roadside(u,s*dd);
      if(riverMask(at.x,at.z)>0.2) continue;
      if(!src||at.y>src.y) src=at.clone();          /* the highest ground: the source */
    }
    if(!src) continue;
    const c=course(src);
    if(c.length>=14) buildStream(c);
  }
}

/* ---------- PASSENGERS — they ride inside, and they get down at every stop.

{

const TRAFFIC=[];

/* where something is in relation to the roadworks: − still short of them,
   + already through. Both directions measure it the same way. */
function worksRel(d){return ((d-WORKS.d+LEN*1.5)%LEN)-LEN/2;}
const PASS_OFF=-2.3;                   /* the one line left open past the mud */

/* they run the loop backwards, on the far side, and recycle once well past us */
function moveTraffic(dt,now){
  const s=now*0.001;
  for(const v of TRAFFIC){
    if(v.on) continue;
    v.wait-=dt;
    if(v.wait>0) continue;
    v.on=true;v.g.visible=true;v.hold=false;
    v.d=(dist+230+Math.random()*150)%LEN;          /* appear up the road */
  }

  /* Half the carriageway is under the pahiro, so it runs one lane at a time.
     While we are coming up to it the flagman holds the other side: they queue
     in their own lane short of the mud, nose to tail, and only come through
     once we are clear. Anyone already in the works is waved on through. */
  const line=new Map();
  if(WORKS.on){
    const ours=worksRel(dist);
    if(ours>-165&&ours<50){
      const q=[];
      for(const v of TRAFFIC){
        if(!v.on) continue;
        const r=worksRel(v.d);
        if(r>0&&r<240) q.push({v,r});
      }
      q.sort((a,b)=>a.r-b.r);                      /* nearest the works first */
      q.forEach((w,i)=>{
        const stop=38+i*9.5;
        /* only whoever is still short of the line — anybody already into the
           works is waved on through. Once stopped they stay stopped: without
           that, the rounding on the way back through worksRel() drops them a
           hair under their own line and lets them straight back out. */
        if(w.r>=stop-2||w.v.hold) line.set(w.v,stop);
      });
    }
  }

  for(const v of TRAFFIC){
    if(!v.on) continue;
    v.d=(v.d-v.speed*dt+LEN)%LEN;
    const stop=line.get(v);
    v.hold=false;
    if(stop!==undefined&&worksRel(v.d)<stop){      /* stand on the line and wait */
      v.d=((WORKS.d+stop)%LEN+LEN)%LEN;v.hold=true;
    }
    const rel=((v.d-dist+LEN/2)%LEN)-LEN/2;        /* + ahead of us, − behind */
    if(rel<-75){                                   /* gone by; park it until next time */
      v.on=false;v.g.visible=false;
      v.wait=7+Math.random()*16;
      continue;
    }
    const u2=v.d/LEN;
    const q=curve.getPointAt(u2);
    const ahead=curve.getPointAt(((u2-0.006)%1+1)%1);
    const tanv=curve.getTangentAt(u2);
    const sidev=new THREE.Vector3().crossVectors(tanv,UP).normalize();
    /* and when they do come, they come over onto our side to get round it */
    let off=-LANE;
    if(WORKS.on){
      const k=1-Math.min(1,Math.abs(worksRel(v.d))/32);
      if(k>0) off=-LANE+(PASS_OFF+LANE)*(k*k*(3-2*k));
    }
    const at=q.clone().addScaledVector(sidev,off);
    v.g.position.set(at.x,q.y+0.1,at.z);
    v.g.lookAt(ahead.x,ahead.y+0.1,ahead.z);
    v.g.rotateY(Math.PI);
    if(v.kind==='bike'){
      if(!v.hold) v.g.rotation.z+=Math.sin(s*2.4+v.speed)*0.06;   /* a little weave */
      v.rider.arm.rotation.x=v.hold?-0.25:-0.75;                  /* feet down, waiting */
    }
  }
}

      const sz=(0.7+k*2.6+Math.random()*0.9)*(near?0.42:1);
      const b=new THREE.Mesh(new THREE.DodecahedronGeometry(sz,0),
        MAT(mud[(Math.random()*mud.length)|0]));
      b.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
      b.scale.y=0.34+Math.random()*0.2;
      put(b,across,along,sz*0.2);
    }
    /* boulders that came down with it */
    for(let i=0;i<7;i++){
      const sz=0.9+Math.random()*1.7;
      const r=new THREE.Mesh(new THREE.DodecahedronGeometry(sz,0),
        MAT(rockC[(Math.random()*rockC.length)|0]));
      r.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
      put(r,2.5+Math.random()*11,(Math.random()-0.5)*15,sz*0.35);
    }
    /* the scar it left, running up the hill above the road */
    for(let i=0;i<11;i++){
      const k=i/10;
      const sz=4.6-k*2.6;
      const s=new THREE.Mesh(new THREE.DodecahedronGeometry(sz,0),
        MAT(mud[i%2?0:3]));
      s.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
      s.scale.y=0.2;
      put(s,13+k*46,(Math.random()-0.5)*9*(1-k*0.6),-0.6);
    }
    /* two trees that came down with the hillside, lying in the debris */
    for(let i=0;i<2;i++){
      const g=new THREE.Group();
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.42,7,6),MAT(0x4A3623));
      tr.rotation.z=Math.PI/2;tr.rotation.y=Math.random();g.add(tr);
      const cr=new THREE.Mesh(new THREE.IcosahedronGeometry(2,0),MAT(0x38512B));
      cr.position.set(3.6,0.7,0.4);cr.scale.y=0.8;g.add(cr);
      g.rotation.y=Math.random()*6.28;
      put(g,5+i*5,(i?1:-1)*(4+Math.random()*4),0.9);
    }

    /* ---- THE DOZER. Built facing +Z, which is across the road at the pile ---- */
    const yellow=MAT(0xE8B21C),yellowD=MAT(0xC9930F),steelD=MAT(0x3A3A3C),
          trackC=MAT(0x24242A),glassD=MAT(0x18222E);
    const dig={};
    {
      const g=new THREE.Group();
      for(const sx of [-1,1]){
        const tr=new THREE.Mesh(new THREE.BoxGeometry(0.95,1,5),trackC);
        tr.position.set(sx*1.35,0.5,0);g.add(tr);
        for(let i=0;i<5;i++){                     /* the rollers under it */
          const rl=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,1.02,8),steelD);
          rl.rotation.z=Math.PI/2;rl.position.set(sx*1.35,0.36,-1.8+i*0.9);g.add(rl);
        }
      }
      const belly=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.5,3.6),steelD);
      belly.position.y=1.05;g.add(belly);
      /* the house: everything above the slew ring turns as one */
      const house=new THREE.Group();house.position.y=1.3;g.add(house);
      const deck=new THREE.Mesh(new THREE.BoxGeometry(2.7,0.5,4.2),yellow);
      deck.position.y=0.25;house.add(deck);
      const eng=new THREE.Mesh(new THREE.BoxGeometry(2.5,1.1,1.9),yellow);
      eng.position.set(0,1.05,-1.1);house.add(eng);
      const cw=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.3,0.8),yellowD);
      cw.position.set(0,0.95,-2.1);house.add(cw);   /* counterweight */
      const cab=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.9,1.8),yellow);
      cab.position.set(-0.55,1.45,0.6);house.add(cab);
      const windscreen=new THREE.Mesh(new THREE.BoxGeometry(1.32,1.5,0.08),glassD);
      windscreen.position.set(-0.55,1.5,1.48);house.add(windscreen);
      const sideGlass=new THREE.Mesh(new THREE.BoxGeometry(0.08,1.4,1.5),glassD);
      sideGlass.position.set(-1.32,1.5,0.6);house.add(sideGlass);
      /* the amber beacon every machine on a Nepali road carries */
      const beacon=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.3,8),
        lampAtNight(new THREE.MeshBasicMaterial({color:0xE07A18}),0xE07A18,0xFFB63A));
      beacon.position.set(-0.55,2.5,0.6);house.add(beacon);
      const beaconGlow=lampGlow(2.6,0.9,0xFF9A20);
      beaconGlow.position.copy(beacon.position);house.add(beaconGlow);
      /* work lights, pointed at whatever it is digging */
      const wl=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.26,0.12),
        lampAtNight(new THREE.MeshBasicMaterial({color:0xDCD3B8}),0xDCD3B8,0xFFFCEE));
      wl.position.set(0.3,2.3,0.5);house.add(wl);
      const wlGlow=lampGlow(2.6,0.9);wlGlow.position.set(0.3,2.3,0.62);house.add(wlGlow);
      const wlBeam=lampBeam(12,2.6,0.42);wlBeam.position.set(0.3,2.25,0.6);
      wlBeam.rotation.x=-Math.PI/2+0.42;             /* aimed down at the pile */
      house.add(wlBeam);

      /* boom → arm → bucket, each hung off the end of the one before */
      const boom=new THREE.Group();boom.position.set(0.55,0.6,1.5);house.add(boom);
      const bm=new THREE.Mesh(new THREE.BoxGeometry(0.55,0.6,4.6),yellow);
      bm.position.z=2.3;boom.add(bm);
      const arm=new THREE.Group();arm.position.z=4.6;boom.add(arm);
      const am=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.48,3.4),yellowD);
      am.position.z=1.7;arm.add(am);
      const buck=new THREE.Group();buck.position.z=3.4;arm.add(buck);
      const bk=new THREE.Mesh(new THREE.BoxGeometry(1.35,1,1.1),steelD);
      bk.position.set(0,-0.4,0.45);buck.add(bk);
      for(let i=0;i<4;i++){                          /* teeth */
        const t=new THREE.Mesh(new THREE.ConeGeometry(0.11,0.42,4),MAT(0x8E8A82));
        t.rotation.x=Math.PI/2;t.position.set(-0.5+i*0.33,-0.72,1.1);buck.add(t);
      }
      /* the boom ram, as one plain cylinder — nobody counts the pins at this size */
      const ram=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,2,6),steelD);
      ram.rotation.x=Math.PI/2.6;ram.position.set(0.55,0.95,1.5);house.add(ram);
      dig.g=g;dig.house=house;dig.boom=boom;dig.arm=arm;dig.buck=buck;
      dig.beaconGlow=beaconGlow;dig.beacon=beacon;
      /* it stands up on the debris it is clearing and reaches out over the road,
         pulling the mud back off the carriageway, which is how it is done */
      g.scale.setScalar(1.25);
      put(g,7.4,-1.5,1.5);
      g.rotation.y=Math.atan2(SS.x,SS.z)+Math.PI;    /* +Z of the group faces our side */
      dig.home=g.rotation.y;
    }
    /* dust off the bucket when it tips */
    const dust=[];
    for(let i=0;i<5;i++){
      const d=new THREE.Mesh(new THREE.SphereGeometry(0.5,7,6),
        new THREE.MeshBasicMaterial({color:0xB9A88E,transparent:true,
          opacity:0,depthWrite:false}));
      dust.push(d);scene.add(d);
    }

    /* the man with the red flag, waving one side through at a time */
    const flagman=makePerson(0xE8842F,0.95);
    put(flagman.who,-4.6,7.5,0);
    flagman.who.lookAt(SP.x,flagman.who.position.y,SP.z);
    const flagStick=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.5,5),MAT(0xB9A472));
    flagStick.rotation.x=Math.PI/2;flagStick.position.z=0.7;flagman.arm.add(flagStick);
    const flagCloth=new THREE.Mesh(new THREE.PlaneGeometry(0.85,0.6),
      new THREE.MeshBasicMaterial({color:0xD8382A,side:THREE.DoubleSide}));
    flagCloth.position.set(0.42,0,1.35);flagman.arm.add(flagCloth);
    /* two on the machine's side with shovels, and two more just watching */
    const crew=[];
    for(let i=0;i<2;i++){
      const w=makePerson([0xE8842F,0xF0C21C][i],0.95);
      put(w.who,4.6+i*2.2,-6-i*2.4,0.5);
      w.who.rotation.y=Math.atan2(SS.x,SS.z)+Math.PI;
      const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.7,5),MAT(0x8A6A44));
      sh.rotation.x=1.2;sh.position.set(0,-0.1,0.6);w.arm.add(sh);
      const bl=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.05,0.44),MAT(0x9A9184));
      bl.rotation.x=1.2;bl.position.set(0,-0.72,1.15);w.arm.add(bl);
      crew.push({...w,ph:Math.random()*6.28,rate:0.9+Math.random()*0.4});
    }
    for(let i=0;i<3;i++){
      const w=makePerson([0xB8232E,0x2B4880,0x2C6754][i],0.92);
      put(w.who,-6.4-i*0.9,-2+i*2.6,0);
      w.who.lookAt(SP.x+SS.x*8,w.who.position.y,SP.z+SS.z*8);
      crew.push({...w,ph:Math.random()*6.28,rate:0.35+Math.random()*0.3});
    }
    /* somebody's bike, parked on the shoulder while they watch */
    {
      const b=motorbike(0x8C2A20);
      put(b.g,-6.8,-8,0);
      b.g.rotation.y=Math.atan2(SS.x,SS.z);
    }

    /* the warning board, and the branches they put out instead of cones */
    {
      const wt=tex((c,w,h)=>{
        c.fillStyle='#F0C21C';c.fillRect(0,0,w,h);
        for(let i=-h;i<w;i+=26){                    /* the hazard stripes */
          c.fillStyle='#1A1712';c.beginPath();
          c.moveTo(i,h);c.lineTo(i+13,h);c.lineTo(i+13+h,0);c.lineTo(i+h,0);c.closePath();c.fill();
        }
        c.fillStyle='#F0C21C';c.fillRect(10,26,w-20,h-52);
        c.fillStyle='#1A1712';c.textAlign='center';c.textBaseline='middle';
        c.font='bold 50px sans-serif';c.fillText('पहिरो — बिस्तारै',w/2,h*0.44);
        c.font='bold 24px sans-serif';c.fillText('LANDSLIDE · GO SLOW',w/2,h*0.71);
      },420,160);
      const bd=new THREE.Group();
      const {at:wAt}=roadside((U-0.026+1)%1,-7.2);   /* clear of the distance pole */
      const wBack=curve.getPointAt(((U-0.06)%1+1)%1);
      facing(bd,wAt,wBack);
      for(const sx of [-1.3,1.3]){
        const post=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,3.4,6),MAT(0x8E8A82));
        post.position.set(sx,1.7,0);bd.add(post);
      }
      const face=new THREE.Mesh(new THREE.PlaneGeometry(3.3,1.26),
        dimAtNight(new THREE.MeshBasicMaterial({map:wt}),0.72));
      face.position.set(0,2.9,0.07);bd.add(face);
      scene.add(bd);
      /* leafy branches laid across the closed lane, which is what actually
         gets used out here */
      for(let i=0;i<4;i++){
        const br=new THREE.Group();
        const st=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.09,1.9,5),MAT(0x5A4028));
        st.rotation.z=Math.PI/2;br.add(st);
        const lf=new THREE.Mesh(new THREE.IcosahedronGeometry(0.6,0),MAT(0x3E5C2C));
        lf.position.x=0.9;lf.scale.set(1,0.5,1);br.add(lf);
        br.rotation.y=Math.random()*6.28;
        put(br,0.9+i*0.8,9.5-i*1.1,0.25);
      }
    }

    /* the debris makes the good lane rough for a moment */
    for(const off of [-0.006,0,0.006])
      HOLES.push({d:((((U+off)*LEN0)%LEN0)+LEN0)%LEN0,jolt:0.075});

    /* one cycle of the machine: swing in, dig, lift, swing out, tip, come back */
    const seg=(x,a,b)=>Math.max(0,Math.min(1,(x-a)/(b-a)));
    const ease=t=>t*t*(3-2*t);
    SLIDE={dig,dust,crew,flagman,flagCloth,seg,ease,u:U,
           at:dig.g.position.clone()};
    WORKS.d=U*LEN0;WORKS.on=true;      /* the traffic on both sides now knows */
  }

  /* ---- STREET LIGHTS. Solar LED heads on their own poles, the kind that went
     up along every highway bazaar in the last few years: a panel on top, a
     battery box, and a cold white head on an arm over the road. They cluster
     where there is something worth lighting and leave the ridges dark. ---- */
  {
    const steelL=MAT(0x9BA0A6),caseL=MAT(0x2E3238),panelL=MAT(0x162238),
          boxL=MAT(0x6E737A);
    const SPACE=34/LEN0;                       /* about thirty-odd metres apart */
    const RUNS=LOW?[{u0:0.345,n:4},{u0:0.812,n:5}]
                  :[{u0:0.335,n:6},{u0:0.806,n:7},{u0:0.128,n:4}];
    for(const run of RUNS) for(let i=0;i<run.n;i++){
      const u=(run.u0+i*SPACE)%1;
      const {p,at}=roadside(u,-8);
      const g=new THREE.Group();facing(g,at,p);   /* +Z points at the road */
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.19,8.4,7),steelL);
      pole.position.y=4.2;g.add(pole);
      const arm=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,2.6),steelL);
      arm.position.set(0,8.2,1.3);g.add(arm);
      const head=new THREE.Mesh(new THREE.BoxGeometry(0.62,0.24,1.3),caseL);
      head.position.set(0,8.05,2.4);head.rotation.x=0.12;g.add(head);
      const lens=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.06,1.1),
        lampAtNight(new THREE.MeshBasicMaterial({color:0x6E7B88}),0x6E7B88,0xF2F8FF));
      lens.position.set(0,7.9,2.4);lens.rotation.x=0.12;g.add(lens);
      /* the panel it runs off, tilted south the way they all are */
      const panel=new THREE.Mesh(new THREE.BoxGeometry(1.3,0.09,1.7),panelL);
      panel.position.set(0,8.62,-0.5);panel.rotation.x=0.34;g.add(panel);
      const batt=new THREE.Mesh(new THREE.BoxGeometry(0.44,0.7,0.5),boxL);
      batt.position.set(0,6.4,-0.28);g.add(batt);
      /* and what it throws: the head burning, a cone, and a pool on the tarmac */
      const gl=lampGlow(3.4,0.85,0xDDEBFF);gl.position.set(0,7.85,2.4);g.add(gl);
      const cone=new THREE.Mesh(new THREE.ConeGeometry(3.4,8.2,10,1,true),
        ADD(beamTex,0xCFE2FF));
      cone.material.side=THREE.DoubleSide;
      cone.position.set(0,3.8,2.4);g.add(glowAtNight(cone,0.34));
      const pool=new THREE.Mesh(new THREE.PlaneGeometry(11,8),ADD(glowTex,0xC6DCFF));
      pool.rotation.x=-Math.PI/2;pool.position.set(0,0.09,2.6);
      g.add(glowAtNight(pool,0.4));
      scene.add(g);
    }
  }

  /* ---- DISTANCE POLES — the green boards counting the destination down.
     Each is painted for the ground it stands on, so the number drops as we
     drive, and they are all repainted whenever the route changes or the sun
     goes down. They stand on our own side of the road, facing back the way we
     came, which is the only way you can read one on the approach. ---- */
  {
    const NPOLE=LOW?8:12;
    const postMat=MAT(0x9A958A),capMat=MAT(0xC8342A);
    const boards=[];
    for(let k=0;k<NPOLE;k++){
      let u=k/NPOLE;
      /* nothing stands on the pul, and the gorge either side is no place for
         a post either — shift those along until they are back on solid ground */
      if(Math.abs(((u-BRIDGE_U+1.5)%1)-0.5)<0.05) u=(u+0.07)%1;
      const {at}=roadside(u,-7.6);
      const back=curve.getPointAt(((u-0.03)%1+1)%1);
      const g=new THREE.Group();facing(g,at,back);
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.13,4,7),postMat);
      post.position.y=2;g.add(post);
      const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,0.16,7),capMat);
      cap.position.y=4.02;g.add(cap);
      /* a canvas each, because each one carries a different number */
      const cv=document.createElement('canvas');cv.width=512;cv.height=200;
      const bt=new THREE.CanvasTexture(cv);
      const face=new THREE.Mesh(new THREE.PlaneGeometry(2.7,1.06),
        new THREE.MeshBasicMaterial({map:bt}));
      face.position.set(0,3.3,0.06);g.add(face);
      const rear=new THREE.Mesh(new THREE.BoxGeometry(2.74,1.1,0.08),MAT(0x6E6A62));
      rear.position.set(0,3.3,0);g.add(rear);
      scene.add(g);
      boards.push({cv,tex:bt,u});
    }
    /* a road sign rounds: to the nearest 5 out here, to the kilometre close in */
    const roundKm=v=>v>40?Math.round(v/5)*5:Math.max(1,Math.round(v));
    function drawPole(cv,np,en,km){
      const c=cv.getContext('2d'),w=cv.width,h=cv.height;
      /* after dark it is the same board, only now it is throwing our own
         headlights back at us — brighter, colder, and the paint has gone flat */
      const dark=nightPhase;
      c.fillStyle=dark?'#0B4A28':'#0E7A3C';c.fillRect(0,0,w,h);
      c.strokeStyle=dark?'#EAFBF0':'#F2FBF5';c.lineWidth=7;
      c.strokeRect(9,9,w-18,h-18);
      c.textBaseline='middle';
      const ink=dark?'#F4FFF8':'#F4FBF6';
      c.shadowColor=dark?'rgba(210,255,228,.75)':'transparent';
      c.shadowBlur=dark?16:0;
      /* the Nepali name across the top, as big as it will go */
      c.textAlign='center';c.fillStyle=ink;
      let fs=64;c.font='bold '+fs+'px sans-serif';
      while(c.measureText(np).width>w-70&&fs>26){fs-=2;c.font='bold '+fs+'px sans-serif';}
      c.fillText(np,w/2,h*0.33);
      /* the English name to the left, the distance to the right */
      c.textAlign='left';
      fs=40;c.font='bold '+fs+'px sans-serif';
      while(c.measureText(en).width>w*0.56&&fs>18){fs-=2;c.font='bold '+fs+'px sans-serif';}
      c.fillText(en,34,h*0.73);
      c.textAlign='right';
      c.fillStyle=dark?'#FFF3C4':'#FFE066';
      c.shadowColor=dark?'rgba(255,226,140,.8)':'transparent';
      c.font='bold 46px sans-serif';
      c.fillText(km+' km',w-34,h*0.72);
      c.shadowBlur=0;
    }
    repaintPoles=function(){
      const total=DEST_KM[DEST]||220, np=DEST_NP[DEST]||DEST, en=DEST.toUpperCase();
      for(const b of boards){
        drawPole(b.cv,np,en,roundKm(total*(1-b.u)));
        b.tex.needsUpdate=true;
      }
    };
    repaintPoles();
  }
}

/* ---------- THE AEROPLANE. Everything that flies into Kathmandu comes in over
   these ridges, so there is nearly always one up there. It is built nose-first
   along +Z, which is the way lookAt() points a thing, and it keeps its own
   materials with the fog off — it flies above the haze, not through it. ---------- */
let plane=null,planeBank=null,navLights=[],trailPuffs=[];
{
  const F=(c)=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:0,fog:false});
  const skin=F(0xEDEBE4),tail=F(0xC8342A),dark=F(0x2A3444),eng=F(0xB9BDC2);
  plane=new THREE.Group();
  planeBank=new THREE.Group();plane.add(planeBank);   /* so it can lean into a turn */

  const fus=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.25,22,9),skin);
  fus.rotation.x=Math.PI/2;planeBank.add(fus);
  const nose=new THREE.Mesh(new THREE.ConeGeometry(1.4,3.6,9),skin);
  nose.rotation.x=Math.PI/2;nose.position.z=12.8;planeBank.add(nose);
  const cone=new THREE.Mesh(new THREE.ConeGeometry(1.25,5,9),skin);
  cone.rotation.x=-Math.PI/2;cone.position.z=-13.4;planeBank.add(cone);
  /* the window line, as one dark stripe — anything finer is invisible up there */
  const strip=new THREE.Mesh(new THREE.BoxGeometry(2.84,0.5,17),dark);
  strip.position.set(0,0.5,0.5);planeBank.add(strip);

  const wing=new THREE.Mesh(new THREE.BoxGeometry(34,0.45,5),skin);
  wing.position.set(0,-0.5,-0.6);planeBank.add(wing);
  const stab=new THREE.Mesh(new THREE.BoxGeometry(12.5,0.4,2.8),skin);
  stab.position.set(0,0.5,-11.6);planeBank.add(stab);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(0.42,5.4,4.4),tail);
  fin.position.set(0,3,-11.8);planeBank.add(fin);
  for(const sx of [-1,1]){
    const pod=new THREE.Mesh(new THREE.CylinderGeometry(1.15,1,4.6,9),eng);
    pod.rotation.x=Math.PI/2;pod.position.set(sx*8.4,-1.5,0.6);planeBank.add(pod);
    const pylon=new THREE.Mesh(new THREE.BoxGeometry(0.4,1.2,2.4),skin);
    pylon.position.set(sx*8.4,-0.9,0.2);planeBank.add(pylon);
  }

  /* Navigation lights: red to port, green to starboard, and the white strobe on
     the tail. They burn by day too, you simply cannot see them — so the glow
     comes up with nightT while the beacons themselves keep blinking regardless. */
  const nav=(sx,col,z,y)=>{
    const b=new THREE.Mesh(new THREE.SphereGeometry(0.42,7,6),
      new THREE.MeshBasicMaterial({color:col,fog:false}));
    b.position.set(sx,y===undefined?-0.4:y,z===undefined?-0.6:z);planeBank.add(b);
    const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:col,
      transparent:true,opacity:0,blending:THREE.AdditiveBlending,
      depthWrite:false,fog:false}));
    gl.scale.set(9,9,1);gl.position.copy(b.position);planeBank.add(gl);
    navLights.push({b,gl,col});
    return {b,gl};
  };
  nav(-17.2,0xFF2E1A);nav(17.2,0x2EFF66);nav(0,0xFFFFFF,-12.4,4.6);
  navLights[0].kind='steady';navLights[1].kind='steady';navLights[2].kind='strobe';

  /* the contrail, as a string of puffs rigid behind it — it flies straight
     enough that nobody will ever know the difference */
  for(let i=0;i<20;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xFFFFFF,
      transparent:true,opacity:0,depthWrite:false,fog:false}));

const FLIGHT={t:0,dur:1,from:new THREE.Vector3(),to:new THREE.Vector3(),bank:0};
/* Not straight overhead — a track that passes off to one side, so it comes up
   over the ridges, crosses the top of the frame and drops away again, instead
   of spending the whole flight somewhere above the roof of the micro. */
function newFlight(){
  const a=Math.random()*Math.PI*2;
  const dx=Math.cos(a),dz=Math.sin(a);           /* the way it is heading */
  const off=(Math.random()<0.5?-1:1)*(880+Math.random()*420);
  const half=1500,alt=330+Math.random()*110;
  FLIGHT.from.set(-dz*off-dx*half,alt,dx*off-dz*half);
  FLIGHT.to.set(-dz*off+dx*half,alt+(Math.random()-0.5)*50,dx*off+dz*half);
  FLIGHT.t=-Math.random()*25;            /* a gap of empty sky between flights */
  FLIGHT.dur=80+Math.random()*55;
  FLIGHT.bank=(Math.random()-0.5)*0.22;
}
newFlight();
/* The opening shot needs something moving in it, and a dot of aeroplane over
   the ridge is the cheapest thing there is to look at. Rather than trust the
   dice, the first flight is aimed at the frame itself: unproject a point in the
   upper right of the view the scene actually opens on, put the aeroplane out
   along that ray, and fly it across. Whatever shape the window is, there is one
   up there when the lights come on. */
let aimed=false;
function aimOpeningFlight(){
  camera.updateMatrixWorld();
  /* The lens is still opening as the shot settles, so aim through the framing
     it is going to have rather than the one it has — otherwise the ray lands
     several degrees low and the aeroplane ends up behind a ridge. */
  const fov0=camera.fov;
  camera.fov=Math.min(74,56+parked*13+portrait*9);camera.updateProjectionMatrix();
  /* clear sky above the ridge line, left of the route pill and below the
     keyboard hint — and a ray that leaves the frame above the hills cannot be
     occluded by them at any distance along it */
  const ray=new THREE.Vector3(0.30,0.85,0.92).unproject(camera).sub(camera.position).normalize();
  camera.fov=fov0;camera.updateProjectionMatrix();
  const at=camera.position.clone().addScaledVector(ray,800);
  const flat=new THREE.Vector3(ray.x,0,ray.z).normalize();
  const side=new THREE.Vector3(-flat.z,0,flat.x);   /* it crosses the view, not along it */
  FLIGHT.dur=105;FLIGHT.bank=0.09;
  FLIGHT.from.copy(at).addScaledVector(side,-1500);
  FLIGHT.to.copy(at).addScaledVector(side,1500).setY(at.y+24);
  FLIGHT.t=FLIGHT.dur*0.5;                          /* dead centre of its own track */
  aimed=true;
}
function flyPlane(dt,now){
  if(!aimed){plane.visible=false;return;}           /* held back for the opening */
  FLIGHT.t+=dt;
  if(FLIGHT.t>=FLIGHT.dur) newFlight();
  const k=FLIGHT.t/FLIGHT.dur;
  plane.visible=k>=0;
  if(k<0) return;
  plane.position.lerpVectors(FLIGHT.from,FLIGHT.to,k);
  plane.lookAt(FLIGHT.to);                          /* built nose-first along +Z */
  planeBank.rotation.z=FLIGHT.bank+Math.sin(now*0.0004)*0.05;
  const s=now*0.001;
  for(const n of navLights){
    const on=n.kind==='strobe'?((s%1.35)<0.09):((s%2.2)<1.5);
    n.b.visible=on;
    n.gl.material.opacity=on?nightT*(n.kind==='strobe'?1:0.85):0;
    n.gl.visible=on&&nightT>0.02;
  }
  /* contrails only show in daylight */
  for(const t of trailPuffs){
    t.s.material.opacity=t.max*(1-nightT);
    t.s.visible=nightT<0.96;
  }
}

/* The handbrake goes on wherever the music stops — but if we happen to have
   pulled up beside a chiya pasal, a khana ghar or a sauchalaya, that is a
   proper halt: the door slides open and everyone gets down. */
const STOP_R=34;                       /* how close counts as "beside" a stop */
function stopNear(d){
  let best=Infinity,found=null;
  for(const t of PASALS){
    const gap=((t.u*LEN-d)%LEN+LEN)%LEN;
    const g=Math.min(gap,LEN-gap);
    if(g<best){best=g;found=t;}
  }
  return best<=STOP_R?found:null;
}
let stopHere=null;                     /* the stop we are pulled up beside */
let wantOut=false,stopT=0,doorOpen=0,boarding=false;

/* Work out the walk each passenger will take, in the micro's own coordinates:
   out of the sliding door, and then over to whatever we stopped for. The door
   is on the kerb side, so when the stop is across the road they go round the
   back of the micro rather than through it — and back the same way. */
function seatRiders(stop){
  micro.updateMatrixWorld();
  const tan=curve.getTangentAt(dist/LEN);
  const n=RIDERS.length;
  for(let i=0;i<n;i++){
    const r=RIDERS[i];
    const w=micro.position.clone().lerp(stop.pos,0.72+((i%3)-1)*0.14);
    w.addScaledVector(tan,(i-(n-1)/2)*1.7);
    w.y=terrainY(w.x,w.z);
    r.look.copy(stop.pos);r.look.y=w.y;
    micro.worldToLocal(r.look);
    const spot=micro.worldToLocal(w);
    r.spot.copy(spot);

    const path=[r.seat.clone(),P_IN.clone(),P_OUT.clone()];
    if(spot.x>0.6){                    /* it is across the road — round the tail */
      const gy=P_OUT.y;
      path.push(new THREE.Vector3(-2.5,gy,5.2),
                new THREE.Vector3(0,gy,5.9+(i%2)*0.5),
                new THREE.Vector3(2.5,gy,5.2));
    }
    path.push(spot.clone());
    r.path=path;r.cum=[0];
    for(let k=1;k<path.length;k++) r.cum.push(r.cum[k-1]+path[k].distanceTo(path[k-1]));
    r.len=r.cum[r.cum.length-1];
    r.dur=Math.min(5,Math.max(1.8,r.len/2.5));   /* an even pace, however far it is */
  }
}
/* where along that walk they are, at 0..1 of the way */
function pathAt(r,x,out){
  if(!r.path||r.path.length<2||r.len<1e-4) return out.copy(r.seat);
  const d=x*r.len;
  for(let k=1;k<r.path.length;k++){
    if(d<=r.cum[k]||k===r.path.length-1){
      const seg=r.cum[k]-r.cum[k-1];
      return out.copy(r.path[k-1]).lerp(r.path[k],seg>1e-6?(d-r.cum[k-1])/seg:1);
    }
  }
  return out.copy(r.path[r.path.length-1]);
}

/* seat → doorway → down the step → out to the shop, and the same in reverse.
   Returns true while anyone is out or the door is still open: the micro waits. */
const rv=new THREE.Vector3(),rw=new THREE.Vector3();
function ridersMove(dt,now){
  const s=now*0.001;
  let busy=false;
  for(const r of RIDERS){
    /* one door between the lot of them, so they take it in turn */
    const order=wantOut?r.order:(RIDERS.length-1-r.order);
    const go=stopT>(wantOut?0.55+order*0.5:0.25+order*0.26);
    const target=wantOut?(go?1:0):(go?0:1);
    const rate=dt/(r.dur*(wantOut?1:0.62));      /* they hurry back on */
    r.x=r.x<target?Math.min(target,r.x+rate):Math.max(target,r.x-rate);
    if(r.x>0.05) busy=true;
    r.who.visible=r.x>0.002||doorOpen>0.02;
    if(!r.who.visible) continue;

    pathAt(r,r.x,rv);
    rw.subVectors(rv,r.who.position);
    const moved=rw.length(),pace=Math.min(1,moved/Math.max(dt,1e-4)/1.7);
    if(moved>0.0015) r.face=Math.atan2(rw.x,rw.z);
    else if(r.x>0.95) r.face=Math.atan2(r.look.x-rv.x,r.look.z-rv.z);
    else if(r.x<0.05) r.face=Math.PI;
    r.who.position.copy(rv);
    const da=((r.face-r.who.rotation.y+Math.PI*3)%(Math.PI*2))-Math.PI;
    r.who.rotation.y+=da*Math.min(1,dt*7);

    if(pace>0.05){                          /* walking: swing an arm, and bob */
      r.arm.rotation.x=Math.sin(s*7.4+r.ph)*0.8*pace;
      r.head.rotation.x=0;
      r.who.position.y+=Math.abs(Math.sin(s*7.4+r.ph))*0.07*pace;
      r.mouth.scale.set(1.3,0.45,0.4);
    }else{                                  /* stood about with a glass of tea */
      const c=(s*r.rate+r.ph/6.28)%1;
      const lift=c<0.42?c/0.42:(c<0.62?1:Math.max(0,1-(c-0.62)/0.38));
      const e=lift*lift*(3-2*lift);
      r.arm.rotation.x=-e*1.2;r.head.rotation.x=-e*0.34;
      r.mouth.scale.set(1.3-e*0.5,0.45+e*1.5,0.4);
    }
    const blink=(s%r.blink)<0.13?0.12:1;
    for(const ey of r.eyes) ey.scale.y=blink;
  }
  /* the door leads them out and waits for the last one back in */
  const want=((wantOut&&stopT>0.25)||busy)?1:0;
  doorOpen=want>doorOpen?Math.min(1,doorOpen+dt*1.15):Math.max(0,doorOpen-dt*1.15);
  if(microDoor){
    microDoor.position.z=doorOpen*2.02;
    microDoor.position.x=-1.70-doorOpen*0.17;
  }
  return busy||doorOpen>0.02;
}

/* ---------- SUNDOWN. One dial: the sky, the three lights, the ridge bands,
   every flat colour that would otherwise blaze, every lamp, and every beam. ---- */
function applySky(t){

  scene.fog.color.copy(FOG_D).lerp(FOG_N,e);

  hemi.intensity=0.9-e*0.58;
  sun.color.copy(SUN_D).lerp(SUN_N,e);
  sun.intensity=1.3-e*0.94;              /* what is left is the moon on the hills */
  sun.position.copy(SUN_POS).lerp(MOON_POS,e);       /* the light comes round with it */
  rim.color.copy(RIM_D).lerp(RIM_N,e);
  rim.intensity=0.42-e*0.2;
  for(const b of skyBands) b.mat.color.copy(b.day).lerp(b.night,e);
  for(const d of dimList) d.mat.color.copy(d.base).multiplyScalar(1-(1-d.f)*e);

  if(sunSprite){sunSprite.material.opacity=1-e;sunSprite.visible=e<0.99;}
  if(moonSprite){moonSprite.material.opacity=e;moonSprite.visible=e>0.01;}
  if(starField){starField.material.opacity=e*0.95;starField.visible=e>0.01;}
}

/* glass up, sip, glass down — plus blinking, a moving mouth, and kettle steam */
function sipTea(now){
  const s=now*0.001;
  for(const t of PASALS){
    for(const who of t.sippers){
      const c=(s*who.rate+who.ph/6.28)%1;          /* one sip per cycle */
      const lift=c<0.42?c/0.42:(c<0.62?1:Math.max(0,1-(c-0.62)/0.38));
      const e=lift*lift*(3-2*lift);                /* ease it */
      who.arm.rotation.x=-e*1.2;
      who.head.rotation.x=-e*0.34;

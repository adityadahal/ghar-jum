<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghar Jaadai — Dashain micro jukebox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23F0A21C'/><path d='M8 26h30l12 10v12a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z' fill='%23F2EFE7' stroke='%23231A12' stroke-width='3' stroke-linejoin='round'/><rect x='13' y='30' width='10' height='8' rx='1' fill='%2318222E'/><rect x='26' y='30' width='10' height='8' rx='1' fill='%2318222E'/><path d='M40 30h4l7 6h-11z' fill='%2318222E'/><rect x='11' y='41' width='26' height='5' fill='%230E7A3C'/><circle cx='20' cy='51' r='6' fill='%231F1D1A'/><circle cx='43' cy='51' r='6' fill='%231F1D1A'/><circle cx='20' cy='51' r='2.2' fill='%23B6B2A8'/><circle cx='43' cy='51' r='2.2' fill='%23B6B2A8'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Mukta:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --marigold:#F0A21C; --tika:#B8232E; --board:#F2E9D8; --ink:#231A12;
    --display:"Bakbak One",Impact,sans-serif; --body:"Mukta",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:var(--body);color:#fff;
    background:linear-gradient(#0B1226 0%,#16223E 24%,#3C4668 45%,#8A5C48 68%,#DE8B52 86%,#F2BE7C 100%)}
  #scene{position:fixed;inset:0;display:block}
  #veil{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(125% 82% at 50% 16%,transparent 42%,rgba(8,11,26,.6) 100%)}
  #ytwrap{position:fixed;left:-10000px;top:0;width:320px;height:180px}

  #board{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
    width:min(560px,calc(100vw - 20px));z-index:5}
  /* glass pill */
  .plate{position:relative;color:#fff;border-radius:999px;
    padding:9px 20px 9px 9px;display:flex;gap:13px;align-items:center;
    background:rgba(22,16,26,.42);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}

  /* artwork as a spinning record — saloon.wtf treatment */
  #disc{position:relative;width:52px;height:52px;flex:0 0 52px;border-radius:50%;
    box-shadow:0 0 0 1px rgba(255,255,255,.22),0 4px 12px rgba(0,0,0,.45)}
  #art{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;
    background:#2A2129;animation:spin 8s linear infinite;animation-play-state:paused}
  #disc.spin #art{animation-play-state:running}
  #spindle{position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:rgba(6,8,14,.8);
    box-shadow:0 0 0 2px rgba(255,255,255,.4);pointer-events:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){#art{animation:none}}

  .col{min-width:0;flex:1}
  h1{font-family:var(--body);font-weight:600;font-size:15px;color:#fff;
    line-height:1.25;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .credit{display:flex;align-items:center;gap:8px;margin:1px 0 0;font-size:12px;
    line-height:1.3;color:rgba(255,255,255,.7)}
  .credit .who{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bar{position:relative;height:4px;margin:7px 0 0;border-radius:999px;
    background:rgba(255,255,255,.22);cursor:pointer;touch-action:none}
  #bar::before{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
  #bar:focus-visible{outline:2px solid #fff;outline-offset:5px}
  #fill{height:100%;width:0;background:rgba(255,255,255,.92);border-radius:999px;
    pointer-events:none}
  #thumb{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;
    border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.55);
    opacity:0;transition:opacity .14s;pointer-events:none}
  #bar:hover #thumb,#bar:focus-visible #thumb,#bar.scrub #thumb{opacity:1}
  #bar.scrub #thumb{transform:scale(1.15)}
  #clock{display:block;margin:4px 0 0;font-size:11px;color:rgba(255,255,255,.6);
    font-variant-numeric:tabular-nums}
  .deck{display:flex;align-items:center;gap:2px;flex:0 0 auto}

  /* the sticker laps the pill's outline, and halts with the music */
  #van{position:absolute;left:0;top:0;width:32px;height:19px;z-index:7;
    pointer-events:none;will-change:transform;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.55))}
  #van svg{width:100%;height:100%;display:block}
  #van .bob{animation:bob .5s ease-in-out infinite alternate;animation-play-state:paused}
  #van.rolling .bob{animation-play-state:running}
  @keyframes bob{to{transform:translateY(-1.1px)}}
  @media (prefers-reduced-motion:reduce){#van .bob{animation:none}}

  button{font-family:var(--body);color:inherit;background:transparent;border:0;
    padding:0;line-height:0;cursor:pointer}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .icon{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;
    color:rgba(255,255,255,.82);transition:background .15s,color .15s,transform .1s}
  .icon:hover{background:rgba(255,255,255,.15);color:#fff}
  .icon:active{transform:scale(.93)}
  .icon svg{width:16px;height:16px;fill:currentColor;display:block}
  #play{width:42px;height:42px;background:#fff;color:#17121B;
    box-shadow:0 2px 10px rgba(0,0,0,.35)}
  #play:hover{background:#fff;color:#17121B;transform:scale(1.05)}
  #play:active{transform:scale(.96)}
  #play svg{width:17px;height:17px}
  #play[aria-busy="true"]{background:rgba(255,255,255,.45);color:#3A3340;box-shadow:none}
  #warn{display:none;margin:0 0 9px;padding:7px 12px;font-size:10.5px;line-height:1.45;
    color:#FFE2DC;background:rgba(120,26,18,.6);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);border-radius:999px;text-align:center}
  #warn code{background:rgba(255,255,255,.16);padding:1px 4px;font-size:10px;border-radius:3px}

  /* glass, shared by the horn, the map and the route picker */
  .glass{background:rgba(22,16,26,.42);
    -webkit-backdrop-filter:blur(24px) saturate(1.5);
    backdrop-filter:blur(24px) saturate(1.5);
    border:1px solid rgba(255,255,255,.2);
    box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}

  /* horn — right edge, vertically centred */
  #horn{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:6;
    width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
    color:rgba(255,255,255,.9);transition:transform .12s,color .15s}
  #horn:hover{color:#fff}
  #horn svg{width:38px;height:38px;display:block;fill:currentColor;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

  /* GTA-style radar: the whole loop, with every stop on it */
  #map{position:fixed;left:20px;bottom:20px;z-index:6;width:168px;height:168px;
    border-radius:50%;overflow:hidden;padding:0}
  #map canvas{display:block;width:100%;height:100%}

  /* what the blips mean */
  #legend{position:fixed;left:20px;bottom:200px;z-index:6;padding:9px 12px;
    border-radius:14px;display:grid;gap:5px;pointer-events:none}
  #legend b{display:block;font-size:8.5px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:1px}
  #legend span{display:flex;align-items:center;gap:7px;font-size:10px;
    color:rgba(255,255,255,.82);white-space:nowrap}
  #legend i{width:8px;height:8px;border-radius:50%;flex:0 0 8px;
    box-shadow:0 0 0 1px rgba(8,10,16,.6)}
  #legend .you{width:0;height:0;border-radius:0;border-left:4.5px solid transparent;
    border-right:4.5px solid transparent;border-bottom:8px solid #fff;box-shadow:none}

  /* masthead */
  #mast{position:fixed;left:22px;top:18px;z-index:6;pointer-events:none;
    line-height:.92}
  #mast .np{display:block;font-family:var(--display);font-weight:400;
    font-size:clamp(38px,5.2vw,64px);color:#F6EFD8;letter-spacing:.01em;
    text-shadow:0 3px 18px rgba(6,10,24,.6),0 1px 2px rgba(6,10,24,.5)}
  #mast .en{display:block;margin-top:9px;font-size:10px;font-weight:700;
    letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.62);
    text-shadow:0 1px 6px rgba(6,10,24,.7)}

  /* route + tape pickers, top right */
  #route{position:fixed;right:18px;top:16px;z-index:6;display:flex;align-items:center;
    gap:9px;padding:7px 9px 7px 14px;border-radius:999px;color:#fff}
  #route .from{font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:rgba(255,255,255,.6)}
  #route .arrow{color:rgba(255,255,255,.45);font-size:12px}
  #route .div{width:1px;height:18px;background:rgba(255,255,255,.2)}
  /* custom dropdowns — a native select cannot be styled where it matters */
  .sel{position:relative}
  .sel .btn{display:flex;align-items:center;gap:7px;font-family:var(--body);
    font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    line-height:1;cursor:pointer;border:1px solid rgba(255,255,255,.25);
    border-radius:999px;padding:6px 10px 6px 12px;transition:background .15s,border-color .15s}
  .sel .btn svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;transition:transform .18s;opacity:.8}
  .sel.open .btn svg{transform:rotate(180deg)}
  .sel .menu{position:absolute;right:0;top:calc(100% + 9px);min-width:172px;
    padding:6px;border-radius:16px;display:none;z-index:20;
    max-height:min(58vh,340px);overflow:auto;overscroll-behavior:contain}
  .sel.open .menu{display:block;animation:drop .16s ease-out}
  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .sel .opt{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    font-family:var(--body);font-size:12px;font-weight:600;letter-spacing:.02em;
    line-height:1.1;color:rgba(255,255,255,.8);cursor:pointer;
    padding:9px 11px;border-radius:11px;transition:background .12s,color .12s}
  .sel .opt:hover,.sel .opt.hot{background:rgba(255,255,255,.14);color:#fff}
  .sel .opt .tick{width:6px;height:6px;border-radius:50%;flex:0 0 6px;
    background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
  .sel .opt[aria-selected="true"]{color:#fff}
  .sel .opt[aria-selected="true"] .tick{background:currentColor;box-shadow:none}
  .sel .menu::-webkit-scrollbar{width:8px}
  .sel .menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:99px}

  #destSel .btn{color:#EAF7EC;background:rgba(14,122,60,.85)}
  #destSel .btn:hover{background:rgba(18,150,74,.92)}
  #destSel .opt[aria-selected="true"]{color:#7FE0A6}
  #tapeSel .btn{color:#fff;background:rgba(255,255,255,.12)}
  #tapeSel .btn:hover{background:rgba(255,255,255,.22)}
  #tapeSel .opt[aria-selected="true"]{color:var(--marigold)}
  #horn:hover{transform:translateY(-50%) scale(1.07)}
  #horn.honk{animation:honk .42s ease-out}       /* two pulses, one per pop */
  @keyframes honk{0%{transform:translateY(-50%) scale(.93)}
    16%{transform:translateY(-50%) scale(1.14)}
    40%{transform:translateY(-50%) scale(.97)}
    58%{transform:translateY(-50%) scale(1.12)}
    100%{transform:translateY(-50%) scale(1)}}

  #hint{position:fixed;left:0;right:0;top:15px;text-align:center;z-index:5;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.6)}
  @media (max-width:900px){ #map{width:124px;height:124px;left:12px;bottom:96px}
    #legend{display:none} }
  @media (max-width:540px){ #hint{display:none}
    #horn{width:56px;height:56px;right:10px} #horn svg{width:31px;height:31px}
    #map{display:none} #route{right:10px;top:10px;padding:5px 7px 5px 10px;gap:6px}
    #route .from,#route .arrow{display:none}
    #mast{left:12px;top:12px} #mast .en{letter-spacing:.22em} }
  @media (max-width:400px){ #disc{width:44px;height:44px;flex-basis:44px}
    #spindle{width:9px;height:9px;margin:-4.5px 0 0 -4.5px} }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="veil"></div>
<div id="hint">← → change song · space play · H horn · drag the bar to seek</div>

<div id="route" class="glass">
  <span class="from">Kathmandu</span><span class="arrow">→</span>
  <div class="sel" id="destSel"></div>
  <span class="div"></span>
  <div class="sel" id="tapeSel"></div>
</div>

<div id="mast">
  <span class="np">दशैं लाग्यो</span>
  <span class="en">Ghar jaadai · घर जाँदै</span>
</div>

<div id="legend" class="glass">
  <b>On the route</b>
  <span><i style="background:#3FBF6E"></i>Chiya pasal</span>
  <span><i style="background:#F0A21C"></i>Thakali khana</span>
  <span><i style="background:#5FA8F0"></i>Sauchalaya</span>
  <span><i style="background:#B9B2A6"></i>Potholes</span>
  <span><i class="you"></i>You</span>
</div>
<div id="map" class="glass"><canvas id="mapc"></canvas></div>

<button id="horn" class="glass" aria-label="Sound the horn" title="Horn (H)">
  <!-- bulb horn: flared bell, neck, squeeze bulb -->
  <svg viewBox="0 0 44 30" aria-hidden="true">
    <path d="M4.6 2.2Q1.4 15 4.6 27.8L20.4 19.6V10.4z"/>
    <path d="M20.4 10.8h5.4a4.2 4.2 0 0 1 0 8.4h-5.4z"/>
    <circle cx="33.4" cy="15" r="6.6"/>
  </svg>
</button>

<div id="board">
  <p id="warn"></p>
  <div class="plate" id="plate">
    <div id="disc">
      <img id="art" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
      <span id="spindle"></span>
    </div>
    <div class="col">
      <h1 id="title">Tap play to start the tape</h1>
      <p class="credit">
        <span class="who" id="credit">Nepali</span>
      </p>
      <div id="bar" role="slider" tabindex="0" aria-label="Seek"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="fill"></div><div id="thumb"></div>
      </div>
      <span id="clock"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
    </div>
    <div class="deck">
      <button id="prev" class="icon" aria-label="Previous song" title="Previous">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2.4v12H6zm3.9 6L18 6v12z"/></svg>
      </button>
      <button id="play" class="icon" aria-label="Play"></button>
      <button id="next" class="icon" aria-label="Next song" title="Next">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 6H18v12h-2.4zM14.1 12L6 18V6z"/></svg>
      </button>
    </div>
    <span id="van" aria-hidden="true">
      <svg viewBox="0 0 44 26">
        <g class="bob">
          <rect x="13" y="1.6" width="13" height="4.2" rx="1.2" fill="#B44430"/>
          <path d="M3.4 5.8h23.4l6.2 5.6v7.2a1.2 1.2 0 0 1-1.2 1.2H4.6a1.2 1.2 0 0 1-1.2-1.2z"
                fill="#F2EFE7" stroke="#231A12" stroke-width="1.3" stroke-linejoin="round"/>
          <rect x="6.2" y="8.2" width="6.6" height="4.4" rx=".7" fill="#18222E"/>
          <rect x="14.6" y="8.2" width="6.6" height="4.4" rx=".7" fill="#18222E"/>
          <path d="M23.6 8.2h3.1l3.9 3.4h-7z" fill="#18222E"/>
          <rect x="5" y="14.4" width="17.6" height="2.7" fill="#0E7A3C"/>
          <rect x="31" y="13.2" width="2.2" height="2.2" rx=".6" fill="#FFF2CC"/>
          <circle cx="10.4" cy="19.9" r="3.1" fill="#1F1D1A"/>
          <circle cx="27" cy="19.9" r="3.1" fill="#1F1D1A"/>
          <circle cx="10.4" cy="19.9" r="1.1" fill="#B6B2A8"/>
          <circle cx="27" cy="19.9" r="1.1" fill="#B6B2A8"/>
        </g>
      </svg>
    </span>
  </div>
</div>
<div id="ytwrap"><div id="ytplayer"></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);

/* Route is picked before the scene builds — the micro's rear board paints it. */
const DESTS=['Birtamode','Jhapa','Pokhara','Dhangadhi','Ilam','Palpa','Butwal','Dharan','Surkhet'];
const pickDest=()=>DESTS[(Math.random()*DESTS.length)|0];
let DEST=pickDest();
let redrawBand=null;                 /* assigned by the scene once the micro exists */
let driving=false;                   /* music playing == micro rolling; paused == tea break */

/* ---- what sits along the loop. Shared: the 3D scene builds these, and the
   banner border plots them, so the sticker passes each one where it should. ---- */
const N_PASAL=9;
const PASAL_US=Array.from({length:N_PASAL},(_,i)=>(i+0.5)/N_PASAL);
const THAKALI_US=[0.365,0.83];       /* dal bhat stops */
const SAUCH_US=[0.198,0.528,0.842];  /* one mid-route, one at each khana ghar */
const POTHOLE_US=[0.442,0.452,0.463,0.474];
const CROSS_US=[0.22,0.72];          /* where children cross */
const POIS=[
  ...PASAL_US.map(u=>({u,kind:'chiya',label:'Chiya pasal'})),
  ...THAKALI_US.map(u=>({u,kind:'thakali',label:'Thakali khana ghar'})),
  ...SAUCH_US.map(u=>({u,kind:'sauch',label:'Sauchalaya'})),
  {u:POTHOLE_US[0],kind:'hole',label:'Potholes — mind the bump'}
];
/* the scene reports where the micro actually is; the sticker and radar follow it */
let routeU=PASAL_US[0],routeMoving=false,hasScene=false;
let mapRoute=[],mapPois=[];                 /* loop outline and stops, in world x/z */
const mapCar={x:0,z:0,a:0};                 /* our position and heading */
function setDest(d){
  DEST=d;
  const el=$('dest');
  if(el&&el.value!==d) el.value=d;
  if(redrawBand)redrawBand();          /* repaint the micro's rear board */
}

if(typeof THREE==='undefined'){
  $('title').textContent='Three.js did not load';
  $('credit').textContent='The scene needs the CDN, but the player below still works.';
  $('hint').style.display='none';
}

/* ============================================================
   SCENE
   ============================================================ */
if(typeof THREE!=='undefined'){(function(){
const canvas=$('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xD8875A,90,880);
const camera=new THREE.PerspectiveCamera(56,1,0.5,2400);
function resize(){renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

scene.add(new THREE.HemisphereLight(0xA8C0E4,0x4E4026,0.78));
const sun=new THREE.DirectionalLight(0xFFC079,1.2);sun.position.set(-620,140,-420);scene.add(sun);
const rim=new THREE.DirectionalLight(0x7E97CC,0.42);rim.position.set(400,220,380);scene.add(rim);

function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return hash(xi,yi)*(1-u)*(1-v)+hash(xi+1,yi)*u*(1-v)+hash(xi,yi+1)*(1-u)*v+hash(xi+1,yi+1)*u*v;}
function fbm(x,y){let a=0,amp=1,f=1,n=0;
  for(let i=0;i<5;i++){a+=vnoise(x*f,y*f)*amp;n+=amp;amp*=0.5;f*=2.05;}return a/n;}
const sstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t);};

const CP=[];
for(let i=0;i<26;i++){const a=i/26*Math.PI*2;const r=270+Math.sin(a*3)*78+Math.cos(a*5)*44;
  CP.push(new THREE.Vector3(Math.cos(a)*r,5+Math.sin(a*2)*13+Math.cos(a*3.7)*7,Math.sin(a)*r));}
const curve=new THREE.CatmullRomCurve3(CP,true,'catmullrom',0.5);
const RS=[];for(let i=0;i<240;i++)RS.push(curve.getPointAt(i/240));
function nearRoad(x,z){let md=1e9,ny=0;
  for(let i=0;i<RS.length;i++){const dx=RS[i].x-x,dz=RS[i].z-z,d=dx*dx+dz*dz;
    if(d<md){md=d;ny=RS[i].y;}}
  return {d:Math.sqrt(md),y:ny};}
function terrainY(x,z){
  const n=nearRoad(x,z),rad=Math.hypot(x,z);
  let h=fbm(x*0.0032+40,z*0.0032+40)*66+fbm(x*0.011,z*0.011)*13+Math.max(0,rad-360)*0.30;
  if(fbm(x*0.0055+9,z*0.0055+9)>0.46&&h<52) h=Math.round(h/2.4)*2.4;
  const k=sstep(11,52,n.d);
  return (n.y-0.55)*(1-k)+h*k;}

function ribbon(halfW,yOff,mat){
  const N=520,pos=[],idx=[],up=new THREE.Vector3(0,1,0);
  for(let i=0;i<=N;i++){
    const u=(i%N)/N;
    const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
    const side=new THREE.Vector3().crossVectors(tan,up).normalize();
    const a=p.clone().addScaledVector(side,-halfW),b=p.clone().addScaledVector(side,halfW);
    a.y+=yOff;b.y+=yOff;pos.push(a.x,a.y,a.z,b.x,b.y,b.z);
    if(i<N){const o=i*2;idx.push(o,o+1,o+2,o+1,o+3,o+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();return new THREE.Mesh(g,mat);
}

const MAT=(c)=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:0});
const UP=new THREE.Vector3(0,1,0);
const LEN0=curve.getLength();        /* loop length, needed while placing things */
/* Nepal keeps left. Negative puts us on the near side of the centreline and
   oncoming traffic (which uses -LANE) on the far side. */
const LANE=-2.7;
/* everything below is placed by (u along the loop, metres off the centreline) */
function roadside(u,off){
  const p=curve.getPointAt(u),tan=curve.getTangentAt(u);
  const side=new THREE.Vector3().crossVectors(tan,UP).normalize();
  const at=p.clone().addScaledVector(side,off);
  at.y=terrainY(at.x,at.z);
  return {p,tan,side,at};
}
function facing(group,at,target){        /* +Z of the group looks at target */
  group.position.copy(at);
  group.lookAt(target.x,at.y,target.z);
}

    b.g.visible=false;scene.add(b.g);
    TRAFFIC.push({g:b.g,kind:'bike',rider:b.rider,speed:23+Math.random()*9,

/* they run the loop backwards, on the far side, and recycle once well past us */
function moveTraffic(dt,now){
  const s=now*0.001;
  for(const v of TRAFFIC){
    if(!v.on){
      v.wait-=dt;
      if(v.wait>0) continue;
      v.on=true;v.g.visible=true;
      v.d=(dist+230+Math.random()*150)%LEN;        /* appear up the road */
      continue;
    }
    v.d=(v.d-v.speed*dt+LEN)%LEN;
    const rel=((v.d-dist+LEN/2)%LEN)-LEN/2;        /* + ahead of us, − behind */
    if(rel<-75){                                   /* gone by; park it until next time */
      v.on=false;v.g.visible=false;
      v.wait=7+Math.random()*16;
      continue;
    }
    const u2=v.d/LEN;
    const q=curve.getPointAt(u2);
    const ahead=curve.getPointAt(((u2-0.006)%1+1)%1);
    const tanv=curve.getTangentAt(u2);
    const sidev=new THREE.Vector3().crossVectors(tanv,UP).normalize();
    const at=q.clone().addScaledVector(sidev,-LANE);
    v.g.position.set(at.x,q.y+0.1,at.z);
    v.g.lookAt(ahead.x,ahead.y+0.1,ahead.z);
    v.g.rotateY(Math.PI);
    if(v.kind==='bike'){
      v.g.rotation.z+=Math.sin(s*2.4+v.speed)*0.06;   /* a little weave */
      v.rider.arm.rotation.x=-0.75;
    }
  }
}

/* distance still to run before the next tea stop */
const STOPS=PASALS.map(t=>t.u*LEN).sort((a,b)=>a-b);
function nextStop(from){
  let best=Infinity,at=0;
  for(const s of STOPS){
    const gap=((s-from)%LEN+LEN)%LEN;
    if(gap<best){best=gap;at=s;}
  }
  return {gap:best,at};
}
function pasalAt(d){                   /* the stop we are parked at, for the camera */
  let best=Infinity,found=null;
  for(const t of PASALS){
    const gap=Math.abs(((t.u*LEN-d)%LEN+LEN)%LEN);
    const g=Math.min(gap,LEN-gap);
    if(g<best){best=g;found=t;}
  }
  return found;
}

function twinkle(list,now){

    u.mat.color.copy(u.base).multiplyScalar(k);

}

/* glass up, sip, glass down — plus blinking, a moving mouth, and kettle steam */
function sipTea(now){
  const s=now*0.001;
  for(const t of PASALS){
    for(const who of t.sippers){
      const c=(s*who.rate+who.ph/6.28)%1;          /* one sip per cycle */
      const lift=c<0.42?c/0.42:(c<0.62?1:Math.max(0,1-(c-0.62)/0.38));
      const e=lift*lift*(3-2*lift);                /* ease it */
      who.arm.rotation.x=-e*1.2;
      who.head.rotation.x=-e*0.34;
      /* mouth opens to take the sip, and the eyes close a little with it */
      who.mouth.scale.set(1.3-e*0.5,0.45+e*1.5,0.4);
      const blink=(s%who.blink)<0.13?0.12:1;       /* a quick blink now and then */
      for(const ey of who.eyes) ey.scale.y=blink*(1-e*0.45);
    }
    for(const st of t.steam){
      const c=(s*0.42+st.ph)%1;
      st.puff.position.y=1.5+c*1.6;
      st.puff.scale.setScalar(0.45+c*1.5);
      st.puff.material.opacity=0.32*(1-c)*(1-c);
    }
  }
}

}

  for(const sw of SWINGS){

    sw.rider.arm.rotation.x=-0.5-a*0.3;

}

/* children step off the kerb, cross, and the micro waits for them */
function kidsCross(dt,now){
  const s=now*0.001;
  for(const c of CROSSINGS){
    if(c.busy){
      c.t+=dt;
      const walk=Math.min(1,Math.max(0,(c.t-1.1)/3.6));   /* pause, then cross */
      for(let i=0;i<c.kids.length;i++){
        const k=c.kids[i];
        const from=-9,to=9;
        const at=(from+(to-from)*walk)*c.dir;
        const j=c.p.clone().addScaledVector(c.side,at);
        j.addScaledVector(c.side,0);
        k.who.position.set(j.x,terrainY(j.x,j.z)+(walk>0&&walk<1?Math.abs(Math.sin(s*7+i))*0.07:0),j.z);
        k.who.rotation.y=Math.atan2(c.side.x*c.dir,c.side.z*c.dir);
        k.arm.rotation.x=(walk>0&&walk<1)?Math.sin(s*7+i)*0.7:-0.2;
        for(const ey of k.eyes) ey.scale.y=(s%3.1)<0.12?0.12:1;
      }
      if(c.t>5.4){c.busy=false;c.dir*=-1;c.cool=26+Math.random()*30;}
    }else{
      c.cool-=dt;
      /* trigger while the micro is still far enough back to brake in comfort */
      const gap=((c.d-dist)%LEN+LEN)%LEN;
      if(c.cool<=0&&driving&&gap>110&&gap<190){c.busy=true;c.t=0;}
      /* park them on the kerb they are waiting at */
      for(let i=0;i<c.kids.length;i++){
        const k=c.kids[i];
        const j=c.p.clone().addScaledVector(c.side,-9*c.dir+ (i*0.8-0.8)*0.3);
        k.who.position.set(j.x,terrainY(j.x,j.z),j.z);
        k.arm.rotation.x=-0.2;
      }
    }
  }
}
function frame(now){
  requestAnimationFrame(frame);
  if(!vis) return;
  /* rAF's timestamp can predate `last`, and a negative dt would drive dist
     negative — JS % keeps the sign, and getPointAt() throws on a negative u. */
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;

  kidsCross(dt,now);

  /* What, if anything, demands a stop ahead?
     Paused means tea; children in the road mean wait either way.
     Capping speed at CRUISE*sqrt(gap/BRAKE) lands on the mark, not past it. */
  let gap=Infinity;
  if(!driving) gap=nextStop(dist).gap;
  for(const c of CROSSINGS){
    if(!c.busy) continue;
    const g=((c.d-dist)%LEN+LEN)%LEN;
    if(g<gap&&g<240) gap=g;
  }

  if(gap===Infinity){
    speed=Math.min(CRUISE,speed+dt*CRUISE*0.7);
  }else if(slow&&!driving){
    dist=(dist+gap)%LEN;gap=0;speed=0;   /* reduced motion: just be there */
  }else{
    const cap=CRUISE*Math.sqrt(Math.max(0,gap)/BRAKE);
    speed=driving?Math.min(Math.min(CRUISE,speed+dt*CRUISE*0.7),cap)
                 :Math.min(speed,cap);
  }
  let step=speed*dt;
  if(gap!==Infinity&&step>=gap){step=gap;speed=0;}   /* land on the mark */
  dist=(dist+step)%LEN;

  const atStop=!driving&&speed<0.15&&nextStop(dist).gap<0.5;
  parked=atStop?Math.min(1,parked+dt*1.5):Math.max(0,parked-dt*2.4);

  /* tell the banner and the radar where we are */
  routeU=dist/LEN;routeMoving=speed>0.35;
  {
    const q=curve.getPointAt(routeU),tq=curve.getTangentAt(routeU);
    mapCar.x=q.x;mapCar.z=q.z;mapCar.a=Math.atan2(tq.x,-tq.z);
  }

  const t=dist/LEN;
  moveTraffic(dt,now);

  const p=curve.getPointAt(t),hd=curve.getPointAt((t+HEAD)%1);
  /* hold our lane, and let the camera hold it too */
  sideV.crossVectors(curve.getTangentAt(t),UP).normalize();
  const lx=sideV.x*LANE,lz=sideV.z*LANE;
  const idle=speed>0.4?Math.sin(now*0.011)*0.05:Math.sin(now*0.02)*0.012;
  /* potholes: a kick up and a roll as the wheels drop in */
  let bump=0,tilt=0;
  for(const h of HOLES){
    const off=((dist-h.d+LEN/2)%LEN)-LEN/2;
    if(Math.abs(off)<3.4){
      const k=Math.exp(-(off*off)/2.2);
      bump+=Math.sin(off*2.4)*h.jolt*k;
      tilt+=Math.cos(off*2.1)*h.jolt*0.24*k;
    }
  }
  const moving=Math.min(1,speed/CRUISE);
  micro.position.set(p.x+lx,p.y+0.12+idle+bump*moving,p.z+lz);
  micro.lookAt(hd.x+lx,hd.y+0.12,hd.z+lz);
  micro.rotateY(Math.PI);
  micro.rotation.z+=Math.sin(now*0.0016)*0.012*moving+tilt*moving;

  const bk=curve.getPointAt((t-BACK+1)%1),lk=curve.getPointAt((t+AHEAD)%1);
  camPos.set(bk.x+lx,bk.y+CAM_Y,bk.z+lz);
  look.set(lk.x+lx,lk.y+LOOK_Y,lk.z+lz);
  if(parked>0.001){                    /* parked: stand back and watch the tea shop */
    const shop=pasalAt(dist);
    if(shop){
      const bk2=curve.getPointAt((t-BACK*2.7+1)%1);
      const so=shop.sgn*6.5;           /* step toward the shop's shoulder */
      tmp.set(bk2.x+sideV.x*so,bk2.y+CAM_Y+2.3,bk2.z+sideV.z*so);
      camPos.lerp(tmp,parked);
      tmp.copy(shop.lookAt);tmp.y+=2;
      look.lerp(tmp,parked*0.85);
    }
  }
  camera.position.lerp(camPos,slow?1:0.09);
  camera.lookAt(look);

  for(const k of kites){const u=k.userData;u.a+=dt*u.sp*0.1;
    k.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(now*0.0009+u.ph)*14,Math.sin(u.a)*u.r);}
  sipTea(now);herd(now);culture(now);
  twinkle(microLights,now);twinkle(villageLights,now);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();}

const pickList=t=>TAPES[t].lists[(Math.random()*TAPES[t].lists.length)|0];
let tape=0,player=null,ready=false,poll=null,firstPlay=true;
const LOCAL=(location.protocol==='file:');
const YT_ERR={2:'bad parameter',5:'HTML5 playback error',100:'track removed',
              101:'embedding disabled',150:'embedding disabled'};

/* ---- a small dropdown that can actually be styled ---- */
const CHEV='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5"/></svg>';
function dropdown(host,opts,value,onPick,label){
  host.innerHTML='<button class="btn" type="button" aria-haspopup="listbox" '
    +'aria-expanded="false" aria-label="'+label+'"><span class="val"></span>'+CHEV+'</button>'
    +'<div class="menu glass" role="listbox"></div>';
  const btn=host.querySelector('.btn'),menu=host.querySelector('.menu'),
        val=host.querySelector('.val');
  let cur=value,hot=-1;
  menu.innerHTML=opts.map((o,i)=>
    '<div class="opt" role="option" data-i="'+i+'" aria-selected="false">'
    +'<span class="tick"></span>'+o.label+'</div>').join('');
  const items=[...menu.querySelectorAll('.opt')];
  function render(){
    const o=opts.find(o=>o.value===cur)||opts[0];
    val.textContent=o.label;
    items.forEach((el,i)=>el.setAttribute('aria-selected',opts[i].value===cur?'true':'false'));
  }
  function open(o){
    host.classList.toggle('open',o);
    btn.setAttribute('aria-expanded',o?'true':'false');
    if(o){hot=opts.findIndex(x=>x.value===cur);paintHot();}
  }
  function paintHot(){items.forEach((el,i)=>el.classList.toggle('hot',i===hot));}
  function choose(i){
    const o=opts[i];if(!o) return;
    cur=o.value;render();open(false);btn.focus();onPick(o.value);
  }
  btn.onclick=e=>{e.stopPropagation();open(!host.classList.contains('open'));};
  items.forEach(el=>el.onclick=e=>{e.stopPropagation();choose(+el.dataset.i);});
  host.addEventListener('keydown',e=>{
    const isOpen=host.classList.contains('open');
    if(e.key==='Escape'&&isOpen){open(false);btn.focus();e.stopPropagation();}
    else if((e.key==='Enter'||e.key===' ')&&!isOpen){open(true);e.preventDefault();}
    else if(e.key==='Enter'&&isOpen){choose(hot);e.preventDefault();}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();e.stopPropagation();
      if(!isOpen){open(true);return;}
      hot=(hot+(e.key==='ArrowDown'?1:opts.length-1))%opts.length;
      paintHot();items[hot].scrollIntoView({block:'nearest'});
    }
  });
  addEventListener('click',()=>open(false));
  render();
  return {set(v){cur=v;render();}};
}

const destPick=dropdown($('destSel'),DESTS.map(d=>({value:d,label:d})),DEST,
  v=>setDest(v),'Destination');
const tapePick=dropdown($('tapeSel'),TAPES.map((t,i)=>({value:String(i),label:t.name})),'0',
  v=>switchTape(+v),'Tape');
setDest(DEST);

function warn(html){const w=$('warn');w.innerHTML=html;w.style.display=html?'block':'none';}

const ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.1L19 12 8 18.9z"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.3v14H7zm6.7 0H17v14h-3.3z"/></svg>';
function setPlay(mode){                /* 'idle' | 'playing' | 'loading' */
  const b=$('play'),playing=(mode==='playing');
  b.innerHTML=playing?ICON_PAUSE:ICON_PLAY;
  b.setAttribute('aria-label',playing?'Pause':'Play');
  b.setAttribute('aria-busy',mode==='loading'?'true':'false');
  b.title=mode==='loading'?'Loading…':(playing?'Pause':'Play');
  $('disc').classList.toggle('spin',playing);
  vanRolling=playing;                  /* the sticker rides only while the tape runs */
  if(!hasScene) $('van').classList.toggle('rolling',playing);
  driving=playing;                     /* and so does the micro out in the scene */
}

/* ============================================================
   VAN STICKER — laps the banner's border, freezes when paused
   ============================================================ */
const VAN_SPEED=52;                    /* px/s, only used if the 3D scene is absent */
const VAN_W=32,VAN_H=19;
let vanRolling=false,vanDist=0,vanPrev=0,plateW=0,plateH=0;

/* the pill is a stadium: two straight runs joined by semicircular caps.
   Walk it by distance and you get the point, plus which way you are facing. */
function pillGeom(){
  const r=plateH/2;
  return {r,straight:Math.max(0,plateW-plateH),arc:Math.PI*r};
}
function pillPoint(d){
  const {r,straight,arc}=pillGeom();
  if(d<straight)               return {x:r+d,y:0,flip:false};
  if(d<straight+arc){
    const a=(d-straight)/r-Math.PI/2;                /* -90° → +90° */
    return {x:plateW-r+Math.cos(a)*r,y:r+Math.sin(a)*r,flip:a>0};
  }
  if(d<2*straight+arc)         return {x:plateW-r-(d-straight-arc),y:plateH,flip:true};
  const a=(d-2*straight-arc)/r+Math.PI/2;
  return {x:r+Math.cos(a)*r,y:r+Math.sin(a)*r,flip:a<Math.PI};
}

function measurePlate(){
  const p=$('plate');plateW=p.clientWidth;plateH=p.clientHeight;
}
addEventListener('resize',measurePlate);

function vanFrame(now){
  requestAnimationFrame(vanFrame);
  const dt=Math.min(0.05,Math.max(0,(now-vanPrev)/1000));vanPrev=now;
  if(!plateW||!plateH) measurePlate();
  const {straight,arc}=pillGeom();
  const per=2*straight+2*arc;
  if(!per) return;
  /* follow the real micro when the scene is up, otherwise just lap the pill */
  if(hasScene){
    vanDist=((routeU%1)+1)%1*per;
    $('van').classList.toggle('rolling',routeMoving);
  }else if(vanRolling){
    vanDist=(vanDist+dt*VAN_SPEED)%per;
  }
  const q=pillPoint(vanDist);
  $('van').style.transform='translate('+(q.x-VAN_W/2)+'px,'+(q.y-VAN_H/2)+'px)'
    +(q.flip?' scaleX(-1)':'');
  drawMap();
}
measurePlate();
requestAnimationFrame(vanFrame);

/* ============================================================
   RADAR — the loop, every stop on it, and where we are
   ============================================================ */
const BLIP={chiya:'#3FBF6E',thakali:'#F0A21C',sauch:'#5FA8F0',hole:'#B9B2A6'};
const mapc=$('mapc');
let mctx=null,mapFit=null;
function fitMap(){
  const box=$('map').getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  mapc.width=Math.round(box.width*dpr);mapc.height=Math.round(box.height*dpr);
  mctx=mapc.getContext('2d');mctx.setTransform(dpr,0,0,dpr,0,0);
  /* fit the loop into the disc once we know its extent */
  if(mapRoute.length){
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for(const p of mapRoute){
      if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];
      if(p[1]<z0)z0=p[1];if(p[1]>z1)z1=p[1];
    }
    const pad=22,w=box.width-pad*2,h=box.height-pad*2;
    const s=Math.min(w/(x1-x0||1),h/(z1-z0||1));
    mapFit={s,cx:box.width/2-(x0+x1)/2*s,cy:box.height/2-(z0+z1)/2*s,size:box.width};
  }
}
addEventListener('resize',fitMap);
function drawMap(){
  if(!mctx||!mapFit||!mapRoute.length) return;
  const {s,cx,cy,size}=mapFit;
  const X=p=>p[0]*s+cx, Y=p=>p[1]*s+cy;
  mctx.clearRect(0,0,size,size);

  /* the road */
  mctx.beginPath();
  mctx.moveTo(X(mapRoute[0]),Y(mapRoute[0]));
  for(let i=1;i<mapRoute.length;i++) mctx.lineTo(X(mapRoute[i]),Y(mapRoute[i]));
  mctx.closePath();
  mctx.lineJoin='round';
  mctx.strokeStyle='rgba(255,255,255,.16)';mctx.lineWidth=7;mctx.stroke();
  mctx.strokeStyle='rgba(255,255,255,.55)';mctx.lineWidth=2.4;mctx.stroke();

  /* every stop */
  for(const b of mapPois){
    const x=b.x*s+cx,y=b.z*s+cy;
    mctx.beginPath();mctx.arc(x,y,4.2,0,6.29);
    mctx.fillStyle=BLIP[b.kind]||'#fff';mctx.fill();
    mctx.lineWidth=1.2;mctx.strokeStyle='rgba(8,10,16,.75)';mctx.stroke();
  }

  /* us */
  const x=mapCar.x*s+cx,y=mapCar.z*s+cy;
  mctx.save();
  mctx.translate(x,y);mctx.rotate(mapCar.a);
  mctx.beginPath();mctx.moveTo(0,-7.5);mctx.lineTo(5.2,6);mctx.lineTo(0,3.4);
  mctx.lineTo(-5.2,6);mctx.closePath();
  mctx.fillStyle='#fff';mctx.fill();
  mctx.lineWidth=1.3;mctx.strokeStyle='rgba(8,10,16,.8)';mctx.stroke();
  mctx.restore();
}
if(hasScene){fitMap();}                /* the scene has filled mapRoute by now */
else{$('map').style.display='none';$('legend').style.display='none';}
const fmt=s=>{if(!isFinite(s)||s<0)s=0;
  return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');};
function cleanTitle(t){
  if(!t) return 'Loading\u2026';
  let s=t.split('|')[0].trim();
  s=s.replace(/\s*[-\u2013\u2014]\s*(full song|lyrical|audio|video song|official).*$/i,'').trim();
  return s.length>2?s:t;
}
function paint(){
  if(!ready||!player.getVideoData) return;
  const d=player.getVideoData();
  if(d&&d.title){
    $('title').textContent=cleanTitle(d.title);
    $('title').title=d.title;          /* the strip clips long names \u2014 keep the full one */
    $('credit').textContent=d.author?(d.author+' \u00b7 '+TAPES[tape].name):TAPES[tape].name;
  }
  if(d&&d.video_id) $('art').src='https://i.ytimg.com/vi/'+d.video_id+'/hqdefault.jpg';
}
function paintBar(frac,cur,dur){
  const pct=Math.max(0,Math.min(1,frac))*100;
  $('fill').style.width=pct+'%';
  $('thumb').style.left=pct+'%';
  $('bar').setAttribute('aria-valuenow',Math.round(pct));
  if(cur!=null) $('cur').textContent=fmt(cur);
  if(dur!=null) $('dur').textContent=fmt(dur);
}
function startPoll(){
  clearInterval(poll);
  poll=setInterval(()=>{
    if(!ready||!player.getDuration||scrubbing) return;   /* don't fight the drag */
    const dur=player.getDuration()||0,cur=player.getCurrentTime()||0;
    paintBar(dur?cur/dur:0,cur,dur);
  },500);
}

/* ---- drag the bar to scrub through the track ---- */
let scrubbing=false,scrubFrac=0,scrubWasPlaying=false;
function trackDur(){return (ready&&player.getDuration)?(player.getDuration()||0):0;}
function fracAt(e){
  const r=$('bar').getBoundingClientRect();
  return r.width?Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)):0;
}
function seekTo(frac){
  const dur=trackDur();
  if(!dur) return;
  player.seekTo(frac*dur,true);
  paintBar(frac,frac*dur,dur);
}
$('bar').addEventListener('pointerdown',e=>{
  if(!trackDur()) return;
  scrubWasPlaying=player.getPlayerState()===YT.PlayerState.PLAYING;
  scrubbing=true;scrubFrac=fracAt(e);
  $('bar').classList.add('scrub');
  try{$('bar').setPointerCapture(e.pointerId);}catch(err){}
  paintBar(scrubFrac,scrubFrac*trackDur(),null);
  e.preventDefault();
});
$('bar').addEventListener('pointermove',e=>{
  if(!scrubbing) return;
  scrubFrac=fracAt(e);
  paintBar(scrubFrac,scrubFrac*trackDur(),null);
});
function endScrub(){
  if(!scrubbing) return;
  scrubbing=false;
  $('bar').classList.remove('scrub');
  seekTo(scrubFrac);
  if(scrubWasPlaying) player.playVideo();   /* a seek must not stop the tape */
}
$('bar').addEventListener('pointerup',endScrub);
$('bar').addEventListener('pointercancel',endScrub);
$('bar').addEventListener('keydown',e=>{
  const dur=trackDur();
  if(!dur) return;
  const cur=player.getCurrentTime()||0;
  let to=null;
  if(e.key==='ArrowRight') to=cur+5;
  else if(e.key==='ArrowLeft') to=cur-5;
  else if(e.key==='Home') to=0;
  else if(e.key==='End') to=dur-1;
  if(to==null) return;
  e.preventDefault();e.stopPropagation();
  seekTo(Math.max(0,Math.min(dur,to))/dur);
});

if(LOCAL){
  warn('YouTube refuses to play from <code>file://</code>. Run '
    +'<code>python3 -m http.server</code> in this folder, then open '
    +'<code>http://localhost:8000</code>.');
}

/* Some tracks in these label playlists refuse embedding (error 150). On a
   freshly built player nextVideo() can be a no-op, which strands us on a dead
   track — so step by explicit index and re-check that something actually rolled. */
let skips=0,skipT=null;
function skipBlocked(label){
  clearTimeout(skipT);
  if(++skips>12){
    skips=0;
    warn('Too many blocked tracks on this tape — try the other one.');
    setPlay('idle');
    return;
  }
  warn('Skipping a track — '+label+'.');
  const list=player.getPlaylist()||[];
  const i=player.getPlaylistIndex?player.getPlaylistIndex():-1;
  if(list.length&&i>=0) player.playVideoAt((i+1)%list.length);
  else player.nextVideo();
  skipT=setTimeout(()=>{               /* nothing rolled? keep walking forward */
    if(ready&&player.getPlayerState()!==YT.PlayerState.PLAYING) skipBlocked(label);
  },2600);
}

/* Build the player immediately on load, so the Play click is a direct
   user gesture rather than an async callback the autoplay policy blocks.

   `autoplay` is set when we are rebuilding for a tape change: loadPlaylist()
   cannot be trusted to swap the queue (it leaves getPlaylist() empty and keeps
   playing the old video), so a tape change constructs a fresh player instead. */
function make(autoplay){
  if(player&&player.destroy){try{player.destroy();}catch(err){}}
  const wrap=$('ytwrap');
  wrap.innerHTML='<div id="ytplayer"></div>';
  ready=false;skips=0;clearTimeout(skipT);
  const vars={listType:'playlist',list:pickList(tape),playsinline:1,controls:0,
              index:Math.floor(Math.random()*24)};   /* start somewhere different */
  if(autoplay) vars.autoplay=1;
  if(!LOCAL) vars.origin=location.origin;
  player=new YT.Player('ytplayer',{
    height:'180',width:'320',playerVars:vars,
    events:{
      onReady:()=>{
        ready=true;player.setShuffle(true);startPoll();paint();
        setPlay(autoplay?'loading':'idle');
        if(!LOCAL) warn('');
        if(autoplay) player.playVideo();
      },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING){
          setPlay('playing');paint();warn('');
          skips=0;clearTimeout(skipT);
        }
        else if(e.data===YT.PlayerState.PAUSED){setPlay('idle');}
        else if(e.data===YT.PlayerState.CUED){paint();}
      },
      onError:e=>{
        const c=e.data,label=YT_ERR[c]||('code '+c);
        if(c===100||c===101||c===150) skipBlocked(label);
        else warn('Player error: '+label+'. '+(LOCAL
          ?'Almost certainly the <code>file://</code> problem above.'
          :'Try the next track.'));
      }
    }
  });
}
setPlay('loading');
(function boot(){
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>{setPlay('idle');
    warn('Could not reach the YouTube API script.');};
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=()=>make(false);
})();

$('play').onclick=()=>{
  if(!ready){warn('Player is still loading \u2014 give it a second.');return;}
  if(player.getPlayerState()===YT.PlayerState.PLAYING){player.pauseVideo();return;}
  if(firstPlay){
    firstPlay=false;
    const n=(player.getPlaylist()||[]).length;
    if(n>1){player.playVideoAt(Math.floor(Math.random()*n));return;}
  }
  player.playVideo();
};
$('next').onclick=()=>{if(ready){player.nextVideo();setTimeout(paint,900);}};
$('prev').onclick=()=>{if(ready){player.previousVideo();setTimeout(paint,900);}};
function showTape(){
  tapePick.set(String(tape));
  $('credit').textContent=TAPES[tape].name;
}
function switchTape(want){
  if(want===tape) return;
  tape=want;
  showTape();
  warn('');
  if(!ready) return;
  make(true);                          /* fresh player on the other tape */
}

/* ============================================================
   HORN \u2014 a bike horn: buzzy diaphragm, two short beeps
   ============================================================ */
let actx=null,clip=null,duckVol=null,duckT=null;
function softClip(){
  const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*2.4)*0.85;}
  return c;
}
function duck(ms){                    /* drop the music under the horn, then restore */
  if(!ready||!player.setVolume) return;
  if(duckVol===null) duckVol=player.getVolume();
  player.setVolume(Math.round(duckVol*0.32));
  clearTimeout(duckT);
  duckT=setTimeout(()=>{player.setVolume(duckVol);duckVol=null;},ms);
}
function honk(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }
  catch(err){ return; }
  if(actx.state==='suspended') actx.resume();
  const t0=actx.currentTime;

  const BEEP=0.17,GAP=0.235,END=GAP+BEEP+0.05;

  const shaper=actx.createWaveShaper();shaper.curve=clip||(clip=softClip());
  /* a bike horn's bite lives around 2 kHz; roll off the mud below 300 Hz */
  const peak=actx.createBiquadFilter();peak.type='peaking';
  peak.frequency.value=2050;peak.Q.value=1.1;peak.gain.value=6;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=0.6;
  const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=300;
  /* the diaphragm rattle: tremolo on its own node, so it multiplies the signal
     instead of fighting the envelope's own automation */
  const am=actx.createGain();am.gain.value=0.82;
  const buzz=actx.createOscillator();buzz.type='square';buzz.frequency.value=68;
  const buzzAmt=actx.createGain();buzzAmt.gain.value=0.18;
  buzz.connect(buzzAmt);buzzAmt.connect(am.gain);
  buzz.start(t0);buzz.stop(t0+END);
  const out=actx.createGain();out.gain.value=0.42;   /* headroom: this clips without it */
  const bus=actx.createGain();
  bus.connect(am);am.connect(shaper);shaper.connect(peak);
  peak.connect(lp);lp.connect(hp);hp.connect(out);out.connect(actx.destination);

  /* two short beeps — peep-peep */
  for(let n=0;n<2;n++){
    const t=t0+n*GAP;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.5,t+0.008);         /* snaps on hard */
    g.gain.setValueAtTime(0.46,t+BEEP*0.62);
    g.gain.exponentialRampToValueAtTime(0.0008,t+BEEP);
    g.connect(bus);

    for(const f of [466,932,1398,1864]){                 /* fundamental + harmonics */
      const o=actx.createOscillator();
      o.type=f>1000?'square':'sawtooth';
      o.frequency.setValueAtTime(f*1.03,t);              /* pitch snaps into place */
      o.frequency.exponentialRampToValueAtTime(f,t+0.022);
      const og=actx.createGain();
      og.gain.value=(f===466?0.42:f===932?0.3:f===1398?0.18:0.1);
      o.connect(og);og.connect(g);
      o.start(t);o.stop(t+BEEP+0.02);
    }
  }

  const b=$('horn');b.classList.remove('honk');void b.offsetWidth;b.classList.add('honk');
  duck(560);
}
$('horn').onclick=honk;

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')$('next').click();
  else if(e.key==='ArrowLeft')$('prev').click();
  else if(e.key===' '){e.preventDefault();$('play').click();}
  else if(e.key==='h'||e.key==='H')$('horn').click();
});
</script>

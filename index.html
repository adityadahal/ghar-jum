/* ---------- THE PAHIRO. One pass of the machine: swing in over the pile, drop
   the boom, curl the bucket through the mud, lift, slew away, tip it off the
   carriageway, come back for the next one. The crew dig, the flagman waves us
   down, and the beacon goes round whatever the hour. ---------- */
function pahiro(dt,now){
  if(!SLIDE) return;
  const {dig,dust,crew,flagman,flagCloth,seg,ease}=SLIDE;
  const s=now*0.001, c=(s/8.5)%1;

  /* slewing: 0 sat over the pile, 1 swung away to tip */
  const swing=ease(seg(c,0.46,0.66))-ease(seg(c,0.86,1));
  dig.house.rotation.y=-0.5+swing*1.25;
  /* the boom drops into the pile, then picks the load up */
  const down=ease(seg(c,0.02,0.2))-ease(seg(c,0.34,0.46));
  dig.boom.rotation.x=-0.72+down*0.5;
  dig.arm.rotation.x=0.95-down*0.28;
  /* and the bucket curls through it, and tips out at the far end of the swing */
  const curl=ease(seg(c,0.16,0.36))-ease(seg(c,0.68,0.8));
  dig.buck.rotation.x=0.25-curl*1.6;
  /* the whole machine rocks on its tracks as it works */
  dig.g.rotation.z=Math.sin(c*Math.PI*2)*0.017+down*0.02;

  /* the beacon, going round */
  const beat=(s*1.6)%1;
  const lit=0.35+0.65*Math.pow(Math.max(0,Math.sin(beat*Math.PI)),6);
  dig.beaconGlow.material.opacity=0.9*nightT*lit+0.12*lit*(1-nightT);
  dig.beaconGlow.visible=lit>0.14;

  /* dust off the load as it tips */
  const tip=seg(c,0.7,0.86);
  dig.buck.updateWorldMatrix(true,false);
  for(let i=0;i<dust.length;i++){
    const d=dust[i],k=(tip+i*0.13)%1;
    if(tip<=0.001||tip>=0.999){d.visible=false;continue;}
    d.visible=true;
    d.position.copy(SLIDE.at);
    d.position.y+=1.4+k*2.2;
    d.position.x+=Math.sin(dig.home+dig.house.rotation.y)*(3+k*2.5)+(i-2)*0.5;
    d.position.z+=Math.cos(dig.home+dig.house.rotation.y)*(3+k*2.5)+(i-2)*0.4;
    d.scale.setScalar(0.7+k*2.4);
    d.material.opacity=0.34*(1-k)*(1-k);
  }

  /* the flagman waves us down, everybody else digs or watches */
  flagman.arm.rotation.x=-0.9+Math.sin(s*2.6)*0.55;
  flagCloth.rotation.y=Math.sin(s*7)*0.5;
  flagCloth.rotation.z=Math.sin(s*5.3)*0.3;
  for(const w of crew){
    const a=Math.sin(s*w.rate*2+w.ph);
    w.arm.rotation.x=w.rate>0.7?(-0.4+a*0.8):(-0.15+a*0.12);
    w.head.rotation.x=w.rate>0.7?a*0.16:0;
    for(const ey of w.eyes) ey.scale.y=(s%3.4)<0.12?0.12:1;
  }
}

/* prayer flags flutter, the linge ping swings */
function culture(now){
  const s=now*0.001;
  for(const f of FLAGS) f.fl.rotation.z=0.3*Math.sin(s*2.2+f.ph);
  if(gadhiFlag) gadhiFlag.rotation.y=Math.sin(s*1.1)*0.38+0.4;
  for(const sw of SWINGS){
    const a=0.75*Math.sin(s*sw.rate*2);
    sw.swing.rotation.x=a;
    sw.rider.arm.rotation.x=-0.5-a*0.3;
  }
}

/* children step off the kerb, cross, and the micro waits for them */
function kidsCross(dt,now){
  const s=now*0.001;
  for(const c of CROSSINGS){
    if(c.busy){
      c.t+=dt;
      const walk=Math.min(1,Math.max(0,(c.t-1.1)/3.6));   /* pause, then cross */
      for(let i=0;i<c.kids.length;i++){
        const k=c.kids[i];
        const from=-9,to=9;
        const at=(from+(to-from)*walk)*c.dir;
        const j=c.p.clone().addScaledVector(c.side,at);
        j.addScaledVector(c.side,0);
        k.who.position.set(j.x,terrainY(j.x,j.z)+(walk>0&&walk<1?Math.abs(Math.sin(s*7+i))*0.07:0),j.z);
        k.who.rotation.y=Math.atan2(c.side.x*c.dir,c.side.z*c.dir);
        k.arm.rotation.x=(walk>0&&walk<1)?Math.sin(s*7+i)*0.7:-0.2;
        for(const ey of k.eyes) ey.scale.y=(s%3.1)<0.12?0.12:1;
      }
      if(c.t>5.4){c.busy=false;c.dir*=-1;c.cool=26+Math.random()*30;}
    }else{
      c.cool-=dt;
      /* trigger while the micro is still far enough back to brake in comfort */
      const gap=((c.d-dist)%LEN+LEN)%LEN;
      if(c.cool<=0&&driving&&gap>110&&gap<190){c.busy=true;c.t=0;}
      /* park them on the kerb they are waiting at */
      for(let i=0;i<c.kids.length;i++){
        const k=c.kids[i];
        const j=c.p.clone().addScaledVector(c.side,-9*c.dir+ (i*0.8-0.8)*0.3);
        k.who.position.set(j.x,terrainY(j.x,j.z),j.z);
        k.arm.rotation.x=-0.2;
      }
    }
  }
}
function frame(now){
  requestAnimationFrame(frame);
  if(!vis) return;
  /* rAF's timestamp can predate `last`, and a negative dt would drive dist
     negative — JS % keeps the sign, and getPointAt() throws on a negative u. */
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;

  /* ease into the dark rather than snapping — it should read as a sundown */
  if(nightT!==nightWant){
    nightT+=(nightWant-nightT)*Math.min(1,dt*1.5);
    if(Math.abs(nightWant-nightT)<0.002) nightT=nightWant;
  }
  if(Math.abs(nightT-nightAt)>0.001){
    applySky(nightT);nightAt=nightT;
    if((nightT>0.5)!==nightPhase) nightFlip(nightT>0.5);
  }

  kidsCross(dt,now);

  /* Pause the tape and the micro stops dead, wherever it happens to be.
     Children in the road are the one thing it slows down for: capping speed at
     CRUISE*sqrt(gap/BRAKE) lands it on the mark rather than past it. */
  let gap=Infinity;
  for(const c of CROSSINGS){
    if(!c.busy) continue;
    const g=((c.d-dist)%LEN+LEN)%LEN;
    if(g<gap&&g<240) gap=g;
  }

  if(!driving||boarding){
    speed=0;                             /* handbrake — and held until all aboard */
  }else if(gap===Infinity){
    speed=Math.min(CRUISE,speed+dt*CRUISE*0.7);
  }else{
    const cap=CRUISE*Math.sqrt(Math.max(0,gap)/BRAKE);
    speed=Math.min(Math.min(CRUISE,speed+dt*CRUISE*0.7),cap);
  }
  /* nobody drives through a pahiro at speed, and the flagman would not let us */
  if(WORKS.on){
    const wr=worksRel(dist);
    if(wr>-48&&wr<32) speed=Math.min(speed,CRUISE*0.38);
  }

  let step=speed*dt;
  if(gap!==Infinity&&step>=gap){step=gap;speed=0;}   /* land on the mark */
  dist=(dist+step)%LEN;

  /* tell the banner and the radar where we are */
  routeU=dist/LEN;routeMoving=speed>0.35;
  {
    const q=curve.getPointAt(routeU),tq=curve.getTangentAt(routeU);
    mapCar.x=q.x;mapCar.z=q.z;mapCar.a=Math.atan2(tq.x,-tq.z);
  }

  const t=dist/LEN;
  moveTraffic(dt,now);

  const p=curve.getPointAt(t),hd=curve.getPointAt((t+HEAD)%1);
  /* hold our lane, and let the camera hold it too */
  tanV.copy(curve.getTangentAt(t));
  sideV.crossVectors(tanV,UP).normalize();
  const lx=sideV.x*LANE,lz=sideV.z*LANE;
  const idle=speed>0.4?Math.sin(now*0.011)*0.05:Math.sin(now*0.02)*0.012;
  /* potholes: a kick up and a roll as the wheels drop in */
  let bump=0,tilt=0;
  for(const h of HOLES){
    const off=((dist-h.d+LEN/2)%LEN)-LEN/2;
    if(Math.abs(off)<3.4){
      const k=Math.exp(-(off*off)/2.2);
      bump+=Math.sin(off*2.4)*h.jolt*k;
      tilt+=Math.cos(off*2.1)*h.jolt*0.24*k;
    }
  }
  const moving=Math.min(1,speed/CRUISE);
  micro.position.set(p.x+lx,p.y+0.12+idle+bump*moving,p.z+lz);
  micro.lookAt(hd.x+lx,hd.y+0.12,hd.z+lz);
  micro.rotateY(Math.PI);
  micro.rotation.z+=Math.sin(now*0.0016)*0.012*moving+tilt*moving;

  /* Are we pulled up beside somewhere worth getting down at? Held on through
     boarding, so the camera stays wide until the last passenger is aboard. */
  if(!driving&&speed===0) stopHere=stopNear(dist);
  else if(driving&&!boarding) stopHere=null;
  const nowWant=!!stopHere&&!driving;
  if(nowWant!==wantOut){wantOut=nowWant;stopT=0;if(nowWant)seatRiders(stopHere);}
  stopT+=dt;
  boarding=ridersMove(dt,now);
  parked=stopHere?Math.min(1,parked+dt*1.3):Math.max(0,parked-dt*2.0);

  const bk=curve.getPointAt((t-BACK+1)%1),lk=curve.getPointAt((t+AHEAD)%1);
  camPos.set(bk.x+lx,bk.y+CAM_Y+portrait*1.3,bk.z+lz);
  look.set(lk.x+lx,lk.y+LOOK_Y+portrait*4.6,lk.z+lz);
  if(parked>0.001&&stopHere){          /* pull right back, on the door side, and watch */
    tmp.copy(micro.position).addScaledVector(sideV,-8.5-portrait*1.5)
                            .addScaledVector(tanV,-20-portrait*9);
    tmp.y=micro.position.y+8.5+portrait*2.4;
    camPos.lerp(tmp,parked);
    tmp.copy(micro.position).lerp(stopHere.pos,0.45);tmp.y+=2.2;
    look.lerp(tmp,parked*0.9);
  }
  camera.position.lerp(camPos,slow?1:0.09);
  camera.lookAt(look);
  /* half a second in, the camera has lerped into its opening framing, whether
     that is parked at the pasal or already rolling — put an aeroplane in it */
  if(!aimed&&++frames>30) aimOpeningFlight();
  /* and widen the lens with it, so the whole stop is in frame */
  const fov=Math.min(74,56+parked*13+portrait*9);
  if(Math.abs(camera.fov-fov)>0.02){
    camera.fov+=(fov-camera.fov)*Math.min(1,dt*3.2);camera.updateProjectionMatrix();
  }
  if(riverFlow) riverFlow.offset.y=(riverFlow.offset.y+dt*0.14)%1;

  for(const k of kites){const u=k.userData;u.a+=dt*u.sp*0.1;
    k.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(now*0.0009+u.ph)*14,Math.sin(u.a)*u.r);}
  flyPlane(dt,now);
  sipTea(now);herd(now);culture(now);pahiro(dt,now);
  /* the jhilimili and the village bulbs come up as everything else goes down */
  const lit=1+nightT*0.55;
  twinkle(microLights,now,lit);twinkle(villageLights,now,lit);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);
})();}

/* ---- a small dropdown that can actually be styled ---- */
const CHEV='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4.5 6 8.5 10 4.5"/></svg>';
function dropdown(host,opts,value,onPick,label){
  host.innerHTML='<button class="btn" type="button" aria-haspopup="listbox" '
    +'aria-expanded="false" aria-label="'+label+'"><span class="val"></span>'+CHEV+'</button>'
    +'<div class="menu glass" role="listbox"></div>';
  const btn=host.querySelector('.btn'),menu=host.querySelector('.menu'),
        val=host.querySelector('.val');
  let cur=value,hot=-1;
  menu.innerHTML=opts.map((o,i)=>
    '<div class="opt" role="option" data-i="'+i+'" aria-selected="false">'
    +'<span class="tick"></span>'+o.label+'</div>').join('');
  const items=[...menu.querySelectorAll('.opt')];
  function render(){
    const o=opts.find(o=>o.value===cur)||opts[0];
    val.textContent=o.label;
    items.forEach((el,i)=>el.setAttribute('aria-selected',opts[i].value===cur?'true':'false'));
  }
  function open(o){
    host.classList.toggle('open',o);
    btn.setAttribute('aria-expanded',o?'true':'false');
    if(o){hot=opts.findIndex(x=>x.value===cur);paintHot();}
  }
  function paintHot(){items.forEach((el,i)=>el.classList.toggle('hot',i===hot));}
  function choose(i){
    const o=opts[i];if(!o) return;
    cur=o.value;render();open(false);btn.focus();onPick(o.value);
  }
  btn.onclick=e=>{e.stopPropagation();open(!host.classList.contains('open'));};
  items.forEach(el=>el.onclick=e=>{e.stopPropagation();choose(+el.dataset.i);});
  host.addEventListener('keydown',e=>{
    const isOpen=host.classList.contains('open');
    if(e.key==='Escape'&&isOpen){open(false);btn.focus();e.stopPropagation();}
    else if((e.key==='Enter'||e.key===' ')&&!isOpen){open(true);e.preventDefault();}
    else if(e.key==='Enter'&&isOpen){choose(hot);e.preventDefault();}
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();e.stopPropagation();
      if(!isOpen){open(true);return;}
      hot=(hot+(e.key==='ArrowDown'?1:opts.length-1))%opts.length;
      paintHot();items[hot].scrollIntoView({block:'nearest'});
    }
  });
  addEventListener('click',()=>open(false));
  render();
  return {set(v){cur=v;render();}};
}

/* ---- Autoplay. The tape is supposed to be rolling before you touch anything,
   but a browser will only autoplay sound for a site it thinks you care about.
   So: ask for it with sound, and if nothing is playing a moment later, mute and
   try again — muted autoplay is always allowed. The first click, key or tap
   after that is the gesture the browser was waiting for, so the sound comes up
   then, by itself. ---- */
let hushed=false,triedMute=false,autoT=null;
function notice(){
  warn(hushed?'The tape is rolling, muted — browsers will not start sound on '
             +'their own. <code>Click anywhere</code> for it.':'');
  $('warn').className=hushed?'hush':'';
}
function tryAutoplay(){
  clearTimeout(autoT);
  autoT=setTimeout(()=>{
    if(!ready||!player.getPlayerState) return;
    if(player.getPlayerState()===YT.PlayerState.PLAYING) return;
    if(triedMute){setPlay('idle');return;}      /* it will not roll at all; wait */
    /* No sound without a gesture, then — so take the tape muted instead. That
       has to be set when the player is built: muting one that is already up
       does not buy back the permission. */
    triedMute=true;hushed=true;notice();
    make(true,true);
  },1500);
}
function unhush(){
  if(!hushed) return;
  hushed=false;notice();
  try{
    player.unMute();
    if(player.getVolume&&!player.getVolume()) player.setVolume(100);
    if(player.getPlayerState()!==YT.PlayerState.PLAYING) player.playVideo();
  }catch(err){}
}

/* ============================================================
   VAN STICKER — laps the banner's border, freezes when paused
   ============================================================ */
const VAN_SPEED=52;                    /* px/s, only used if the 3D scene is absent */
const VAN_W=32,VAN_H=19;
let vanRolling=false,vanDist=0,vanPrev=0,plateW=0,plateH=0;

/* the pill is a stadium: two straight runs joined by semicircular caps.
   Walk it by distance and you get the point, plus which way you are facing. */
function pillGeom(){
  const r=plateH/2;
  return {r,straight:Math.max(0,plateW-plateH),arc:Math.PI*r};
}
function pillPoint(d){
  const {r,straight,arc}=pillGeom();
  if(d<straight)               return {x:r+d,y:0,flip:false};
  if(d<straight+arc){
    const a=(d-straight)/r-Math.PI/2;                /* -90° → +90° */
    return {x:plateW-r+Math.cos(a)*r,y:r+Math.sin(a)*r,flip:a>0};
  }
  if(d<2*straight+arc)         return {x:plateW-r-(d-straight-arc),y:plateH,flip:true};
  const a=(d-2*straight-arc)/r+Math.PI/2;
  return {x:r+Math.cos(a)*r,y:r+Math.sin(a)*r,flip:a<Math.PI};
}

function measurePlate(){
  const p=$('plate');plateW=p.clientWidth;plateH=p.clientHeight;
  /* the horn and the radar park just above the player, whatever height it is */
  document.documentElement.style.setProperty('--boardH',$('board').offsetHeight+'px');
}

function vanFrame(now){
  requestAnimationFrame(vanFrame);
  const dt=Math.min(0.05,Math.max(0,(now-vanPrev)/1000));vanPrev=now;
  if(!plateW||!plateH) measurePlate();
  const {straight,arc}=pillGeom();
  const per=2*straight+2*arc;
  if(!per) return;
  /* follow the real micro when the scene is up, otherwise just lap the pill */
  if(hasScene){
    vanDist=((routeU%1)+1)%1*per;
    $('van').classList.toggle('rolling',routeMoving);
  }else if(vanRolling){
    vanDist=(vanDist+dt*VAN_SPEED)%per;
  }
  const q=pillPoint(vanDist);
  $('van').style.transform='translate('+(q.x-VAN_W/2)+'px,'+(q.y-VAN_H/2)+'px)'
    +(q.flip?' scaleX(-1)':'');
  drawMap();
}

/* ============================================================
   RADAR — the loop, every stop on it, and where we are
   ============================================================ */
const BLIP={chiya:'#3FBF6E',thakali:'#F0A21C',sauch:'#5FA8F0',hole:'#B9B2A6',
            bridge:'#E4DCC8'};
const mapc=$('mapc');
let mctx=null,mapFit=null;
function fitMap(){
  const box=$('map').getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  mapc.width=Math.round(box.width*dpr);mapc.height=Math.round(box.height*dpr);
  mctx=mapc.getContext('2d');mctx.setTransform(dpr,0,0,dpr,0,0);
  /* fit the loop into the disc once we know its extent */
  if(mapRoute.length){
    let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;
    for(const p of mapRoute){
      if(p[0]<x0)x0=p[0];if(p[0]>x1)x1=p[0];
      if(p[1]<z0)z0=p[1];if(p[1]>z1)z1=p[1];
    }
    const pad=22,w=box.width-pad*2,h=box.height-pad*2;
    const s=Math.min(w/(x1-x0||1),h/(z1-z0||1));
    mapFit={s,cx:box.width/2-(x0+x1)/2*s,cy:box.height/2-(z0+z1)/2*s,size:box.width};
  }
}
addEventListener('resize',fitMap);
function drawMap(){
  if(!mctx||!mapFit||!mapRoute.length) return;
  const {s,cx,cy,size}=mapFit;
  const X=p=>p[0]*s+cx, Y=p=>p[1]*s+cy;
  mctx.clearRect(0,0,size,size);

  /* the khola, under everything else */
  if(mapRiver.length){
    mctx.beginPath();
    mctx.moveTo(X(mapRiver[0]),Y(mapRiver[0]));
    for(let i=1;i<mapRiver.length;i++) mctx.lineTo(X(mapRiver[i]),Y(mapRiver[i]));
    mctx.lineCap='round';
    mctx.strokeStyle='rgba(95,168,240,.5)';mctx.lineWidth=4;mctx.stroke();
  }

  /* the road */
  mctx.beginPath();
  mctx.moveTo(X(mapRoute[0]),Y(mapRoute[0]));
  for(let i=1;i<mapRoute.length;i++) mctx.lineTo(X(mapRoute[i]),Y(mapRoute[i]));
  mctx.closePath();
  mctx.lineJoin='round';
  mctx.strokeStyle='rgba(255,255,255,.16)';mctx.lineWidth=7;mctx.stroke();
  mctx.strokeStyle='rgba(255,255,255,.55)';mctx.lineWidth=2.4;mctx.stroke();

  /* every stop */
  for(const b of mapPois){
    const x=b.x*s+cx,y=b.z*s+cy;
    mctx.beginPath();mctx.arc(x,y,4.2,0,6.29);
    mctx.fillStyle=BLIP[b.kind]||'#fff';mctx.fill();
    mctx.lineWidth=1.2;mctx.strokeStyle='rgba(8,10,16,.75)';mctx.stroke();
  }

  /* us */
  const x=mapCar.x*s+cx,y=mapCar.z*s+cy;
  mctx.save();
  mctx.translate(x,y);mctx.rotate(mapCar.a);
  mctx.beginPath();mctx.moveTo(0,-7.5);mctx.lineTo(5.2,6);mctx.lineTo(0,3.4);
  mctx.lineTo(-5.2,6);mctx.closePath();
  mctx.fillStyle='#fff';mctx.fill();
  mctx.lineWidth=1.3;mctx.strokeStyle='rgba(8,10,16,.8)';mctx.stroke();
  mctx.restore();
}
if(hasScene){fitMap();}                /* the scene has filled mapRoute by now */
else{$('map').style.display='none';$('legend').style.display='none';}

}

    if(!ready||!player.getDuration||scrubbing) return;   /* don't fight the drag */
    const dur=player.getDuration()||0,cur=player.getCurrentTime()||0;
    paintBar(dur?cur/dur:0,cur,dur);
  },500);
}

/* ---- drag the bar to scrub through the track ---- */
let scrubbing=false,scrubFrac=0,scrubWasPlaying=false;
function trackDur(){return (ready&&player.getDuration)?(player.getDuration()||0):0;}
function fracAt(e){
  const r=$('bar').getBoundingClientRect();
  return r.width?Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)):0;
}
function seekTo(frac){
  const dur=trackDur();
  if(!dur) return;
  player.seekTo(frac*dur,true);
  paintBar(frac,frac*dur,dur);
}
$('bar').addEventListener('pointerdown',e=>{
  if(!trackDur()) return;
  scrubWasPlaying=player.getPlayerState()===YT.PlayerState.PLAYING;
  scrubbing=true;scrubFrac=fracAt(e);
  $('bar').classList.add('scrub');
  try{$('bar').setPointerCapture(e.pointerId);}catch(err){}
  paintBar(scrubFrac,scrubFrac*trackDur(),null);
  e.preventDefault();
});
$('bar').addEventListener('pointermove',e=>{
  if(!scrubbing) return;
  scrubFrac=fracAt(e);
  paintBar(scrubFrac,scrubFrac*trackDur(),null);
});
function endScrub(){
  if(!scrubbing) return;
  scrubbing=false;
  $('bar').classList.remove('scrub');
  seekTo(scrubFrac);
  if(scrubWasPlaying) player.playVideo();   /* a seek must not stop the tape */
}
$('bar').addEventListener('pointerup',endScrub);
$('bar').addEventListener('pointercancel',endScrub);
$('bar').addEventListener('keydown',e=>{
  const dur=trackDur();
  if(!dur) return;
  const cur=player.getCurrentTime()||0;
  let to=null;
  if(e.key==='ArrowRight') to=cur+5;
  else if(e.key==='ArrowLeft') to=cur-5;
  else if(e.key==='Home') to=0;
  else if(e.key==='End') to=dur-1;
  if(to==null) return;
  e.preventDefault();e.stopPropagation();
  seekTo(Math.max(0,Math.min(dur,to))/dur);
});

if(LOCAL){
  warn('YouTube refuses to play from <code>file://</code>. Run '
    +'<code>python3 -m http.server</code> in this folder, then open '
    +'<code>http://localhost:8000</code>.');
}

/* Some tracks in these label playlists refuse embedding (error 150). On a
   freshly built player nextVideo() can be a no-op, which strands us on a dead
   track — so step by explicit index and re-check that something actually rolled. */
let skips=0,skipT=null;
function skipBlocked(label){
  clearTimeout(skipT);
  if(++skips>12){
    skips=0;
    warn('Too many blocked tracks on this tape — try the other one.');
    setPlay('idle');
    return;
  }
  warn('Skipping a track — '+label+'.');
  const list=player.getPlaylist()||[];
  const i=player.getPlaylistIndex?player.getPlaylistIndex():-1;
  if(list.length&&i>=0) player.playVideoAt((i+1)%list.length);
  else player.nextVideo();
  skipT=setTimeout(()=>{               /* nothing rolled? keep walking forward */
    if(ready&&player.getPlayerState()!==YT.PlayerState.PLAYING) skipBlocked(label);
  },2600);
}

/* Build the player immediately on load, so the Play click is a direct
   user gesture rather than an async callback the autoplay policy blocks.

   `autoplay` is set when we are rebuilding for a tape change: loadPlaylist()
   cannot be trusted to swap the queue (it leaves getPlaylist() empty and keeps
   playing the old video), so a tape change constructs a fresh player instead. */
function make(autoplay,muted){
  if(player&&player.destroy){try{player.destroy();}catch(err){}}
  const wrap=$('ytwrap');
  wrap.innerHTML='<div id="ytplayer"></div>';
  ready=false;skips=0;clearTimeout(skipT);
  const vars={listType:'playlist',list:pickList(tape),playsinline:1,controls:0,
              index:Math.floor(Math.random()*24)};   /* start somewhere different */
  if(autoplay) vars.autoplay=1;
  if(muted) vars.mute=1;
  if(!LOCAL) vars.origin=location.origin;
  player=new YT.Player('ytplayer',{
    height:'180',width:'320',playerVars:vars,
    events:{
      onReady:()=>{
        ready=true;player.setShuffle(true);startPoll();paint();
        setPlay(autoplay?'loading':'idle');
        if(!LOCAL) notice();
        if(autoplay){
          firstPlay=false;                 /* the tape already picked its own track */
          player.playVideo();
          tryAutoplay();                   /* and mute rather than not play at all */
        }
      },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.PLAYING){
          setPlay('playing');paint();notice();
          clearTimeout(autoT);
          skips=0;clearTimeout(skipT);
        }
        else if(e.data===YT.PlayerState.PAUSED){setPlay('idle');}
        else if(e.data===YT.PlayerState.CUED){paint();}
      },
      onError:e=>{
        const c=e.data,label=YT_ERR[c]||('code '+c);
        if(c===100||c===101||c===150) skipBlocked(label);
        else warn('Player error: '+label+'. '+(LOCAL
          ?'Almost certainly the <code>file://</code> problem above.'
          :'Try the next track.'));
      }
    }
  });
}
setPlay('loading');
(function boot(){
  const s=document.createElement('script');
  s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>{setPlay('idle');
    warn('Could not reach the YouTube API script.');};
  document.head.appendChild(s);
  window.onYouTubeIframeAPIReady=()=>make(true);   /* rolling from the off */
})();

$('play').onclick=()=>{
  if(!ready){warn('Player is still loading \u2014 give it a second.');return;}
  if(player.getPlayerState()===YT.PlayerState.PLAYING){player.pauseVideo();return;}
  if(firstPlay){
    firstPlay=false;
    const n=(player.getPlaylist()||[]).length;
    if(n>1){player.playVideoAt(Math.floor(Math.random()*n));return;}
  }
  player.playVideo();
};
$('next').onclick=()=>{if(ready){player.nextVideo();setTimeout(paint,900);}};
$('prev').onclick=()=>{if(ready){player.previousVideo();setTimeout(paint,900);}};
function showTape(){
  tapePick.set(String(tape));
  $('credit').textContent=TAPES[tape].name;
}
function switchTape(want){
  if(want===tape) return;
  tape=want;
  showTape();
  warn('');
  if(!ready) return;
  make(true);                          /* fresh player on the other tape */
}

/* ============================================================
   HORN \u2014 a bike horn: buzzy diaphragm, two short beeps
   ============================================================ */
let actx=null,clip=null,duckVol=null,duckT=null;
function softClip(){
  const n=1024,c=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*2.4)*0.85;}
  return c;
}
function duck(ms){                    /* drop the music under the horn, then restore */
  if(!ready||!player.setVolume) return;
  if(duckVol===null) duckVol=player.getVolume();
  player.setVolume(Math.round(duckVol*0.32));
  clearTimeout(duckT);
  duckT=setTimeout(()=>{player.setVolume(duckVol);duckVol=null;},ms);
}
function honk(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); }
  catch(err){ return; }
  if(actx.state==='suspended') actx.resume();
  const t0=actx.currentTime;

  const BEEP=0.17,GAP=0.235,END=GAP+BEEP+0.05;

  const shaper=actx.createWaveShaper();shaper.curve=clip||(clip=softClip());
  /* a bike horn's bite lives around 2 kHz; roll off the mud below 300 Hz */
  const peak=actx.createBiquadFilter();peak.type='peaking';
  peak.frequency.value=2050;peak.Q.value=1.1;peak.gain.value=6;
  const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.Q.value=0.6;
  const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=300;
  /* the diaphragm rattle: tremolo on its own node, so it multiplies the signal
     instead of fighting the envelope's own automation */
  const am=actx.createGain();am.gain.value=0.82;
  const buzz=actx.createOscillator();buzz.type='square';buzz.frequency.value=68;
  const buzzAmt=actx.createGain();buzzAmt.gain.value=0.18;
  buzz.connect(buzzAmt);buzzAmt.connect(am.gain);
  buzz.start(t0);buzz.stop(t0+END);
  const out=actx.createGain();out.gain.value=0.42;   /* headroom: this clips without it */
  const bus=actx.createGain();
  bus.connect(am);am.connect(shaper);shaper.connect(peak);
  peak.connect(lp);lp.connect(hp);hp.connect(out);out.connect(actx.destination);

  /* two short beeps — peep-peep */
  for(let n=0;n<2;n++){
    const t=t0+n*GAP;
    const g=actx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.5,t+0.008);         /* snaps on hard */
    g.gain.setValueAtTime(0.46,t+BEEP*0.62);
    g.gain.exponentialRampToValueAtTime(0.0008,t+BEEP);
    g.connect(bus);

    for(const f of [466,932,1398,1864]){                 /* fundamental + harmonics */
      const o=actx.createOscillator();
      o.type=f>1000?'square':'sawtooth';
      o.frequency.setValueAtTime(f*1.03,t);              /* pitch snaps into place */
      o.frequency.exponentialRampToValueAtTime(f,t+0.022);
      const og=actx.createGain();
      og.gain.value=(f===466?0.42:f===932?0.3:f===1398?0.18:0.1);
      o.connect(og);og.connect(g);
      o.start(t);o.stop(t+BEEP+0.02);
    }
  }

  const b=$('horn');b.classList.remove('honk');void b.offsetWidth;b.classList.add('honk');
  duck(560);
}
$('horn').onclick=honk;
$('sky').onclick=()=>setNight(!night);

addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')$('next').click();
  else if(e.key==='ArrowLeft')$('prev').click();
  else if(e.key===' '){e.preventDefault();$('play').click();}
  else if(e.key==='h'||e.key==='H')$('horn').click();
  else if(e.key==='n'||e.key==='N')$('sky').click();
});
</script>
